# ─────────────────────────────────────────────────────────────────────────────
# USRP frontend workspace globs.
#
# A pnpm workspace glob matches ONE path segment. `packages/*` matches
# `packages/features` and does NOT match `packages/features/identity`, so the
# six vertical feature slices need their own nested glob. Without it,
# packages/testing's six `@usrp/feature-*: workspace:*` dependencies cannot
# resolve and `pnpm install --frozen-lockfile` fails before it fetches anything.
#
# That is not hypothetical: it was the defect that made main un-installable
# from 2026-09-08 13:41 until the workspace glob was corrected.
#
# `tooling/*` is here because tooling/edge-dev is a real workspace package
# (`@usrp/edge-dev`) that docs/architecture/edge-contract.md invokes by
# `pnpm --filter`. Directories under these globs without a package.json, such as
# tooling/repo-hygiene, are ignored by pnpm and cost nothing.
# ─────────────────────────────────────────────────────────────────────────────
packages:
  - "apps/*"
  - "packages/*"
  - "packages/features/*"
  - "tooling/*"

overrides:
  "@remix-run/router": "^1.23.2"
  "@types/react": "18.3.0"
  "js-yaml@4.3.1": "4.3.2"
  "@types/react-dom": "18.3.0"
