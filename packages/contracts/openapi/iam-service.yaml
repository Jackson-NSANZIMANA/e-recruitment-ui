components:
  schemas:
    OfficerRow:
      type: "object"
      additionalProperties: false
      required: ["officerId", "loginHandle", "posts", "status", "createdAt", "activatedAt", "lastLoginAt", "activationExpiresAt", "activationState", "releasableByYou"]
      properties:
        officerId:
          type: "string"
          format: "uuid"
        loginHandle:
          type: "string"
        posts:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
          enum: ["active", "disabled", "pending"]
        createdAt:
          type: "string"
          format: "date-time"
        activatedAt:
          type: ["string", "null"]
          format: "date-time"
        lastLoginAt:
          type: ["string", "null"]
          format: "date-time"
        activationExpiresAt:
          type: ["string", "null"]
          format: "date-time"
        activationState:
          type: ["string", "null"]
        releasableByYou:
          type: "boolean"

    OfficerListOk:
      type: "object"
      additionalProperties: false
      required: ["officers"]
      properties:
        officers:
          type: "array"
          items:
            "$ref": "#/components/schemas/OfficerRow"

    OfficerCreateRequest:
      type: "object"
      additionalProperties: false
      required: ["loginHandle", "posts"]
      properties:
        loginHandle:
          type: "string"
        posts:
          type: "array"
          items:
            type: "string"

    OfficerOpened:
      type: "object"
      additionalProperties: false
      required: ["outcome", "officer"]
      properties:
        outcome:
          type: "string"
          enum: ["CREATED", "REISSUED"]
        officer:
          "$ref": "#/components/schemas/OfficerRow"

    OfficerReleased:
      type: "object"
      additionalProperties: false
      required: ["outcome", "officer", "activation"]
      properties:
        outcome:
          type: "string"
          enum: ["RELEASED"]
        officer:
          "$ref": "#/components/schemas/OfficerRow"
        activation:
          type: "object"
          additionalProperties: false
          required: ["code", "expiresAt"]
          properties:
            code:
              type: "string"
            expiresAt:
              type: "string"
              format: "date-time"

    OfficerTargetRequest:
      type: "object"
      additionalProperties: false
      required: ["targetOfficerId"]
      properties:
        targetOfficerId:
          type: "string"
          format: "uuid"

    OfficerPostsRequest:
      type: "object"
      additionalProperties: false
      required: ["targetOfficerId", "posts", "reasonCode"]
      properties:
        targetOfficerId:
          type: "string"
          format: "uuid"
        posts:
          type: "array"
          items:
            type: "string"
        reasonCode:
          type: "string"

    OfficerReasonRequest:
      type: "object"
      additionalProperties: false
      required: ["targetOfficerId", "reasonCode"]
      properties:
        targetOfficerId:
          type: "string"
          format: "uuid"
        reasonCode:
          type: "string"

    OfficerChangeOk:
      type: "object"
      additionalProperties: false
      required: ["outcome", "officer", "sessionsRevoked"]
      properties:
        outcome:
          type: "string"
          enum: ["ASSIGNED", "DISABLED", "ENABLED", "REVOKED", "UNCHANGED"]
        officer:
          "$ref": "#/components/schemas/OfficerRow"
        sessionsRevoked:
          type: "integer"
          minimum: 0

    OfficerActivateRequest:
      type: "object"
      additionalProperties: false
      required: ["loginHandle", "activationCode", "password"]
      properties:
        loginHandle:
          type: "string"
        activationCode:
          type: "string"
        password:
          type: "string"

    OfficerAdminError:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["INVALID_REQUEST", "INVALID_HANDLE", "INVALID_POSTS", "UNKNOWN_POST", "INVALID_REASON", "AGENCY_ADMIN_NOT_ASSIGNABLE", "SELF_MODIFICATION", "NOT_FOUND", "HANDLE_TAKEN", "LAST_ACTIVE_ADMIN", "NOT_PENDING_ACTIVATION", "SAME_ADMIN", "ALREADY_RELEASED", "ACTIVATION_EXPIRED", "PERMISSION_DENIED", "UNAUTHENTICATED", "WEAK_PASSWORD", "ACTIVATION_REJECTED"]
        detail:
          type: "string"

    OfficerLoginRequest:
      type: "object"
      additionalProperties: false
      required: ["loginHandle", "password"]
      properties:
        loginHandle:
          description: "Max 128 chars — matches officer_accounts.login_handle."
          type: "string"
          minLength: 1
          maxLength: 128
        password:
          description: "Max 256 chars. Never echoed, logged, or placed in an error."
          type: "string"
          minLength: 1
          maxLength: 256

    ServiceTokenRequest:
      type: "object"
      additionalProperties: false
      required: ["clientId", "clientSecret"]
      properties:
        clientId:
          type: "string"
          minLength: 1
          maxLength: 128
        clientSecret:
          type: "string"
          minLength: 1
          maxLength: 256

    TokenIssued:
      description: >-
        The whole success body. Two fields. Nothing else is returned by either
        grant — this is the shape, not an abridgement of it.
      type: "object"
      additionalProperties: false
      required: ["token", "expiresAt"]
      properties:
        token:
          description: "A compact Ed25519 JWS. Opaque to the frontend by policy."
          type: "string"
        expiresAt:
          description: >-
            Absolute expiry. There is NO refresh endpoint and no revocation
            list for this credential kind: an officer token is valid until it
            expires, by design (ADR-016). The UI must re-authenticate, not
            refresh.
          type: "string"
          format: "date-time"

    InvalidRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_REQUEST"
        detail:
          type: "string"

    InvalidCredentials401:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_CREDENTIALS"
        detail:
          type: "string"

    InvalidClient401:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_CLIENT"
        detail:
          type: "string"
