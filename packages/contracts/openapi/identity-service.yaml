# ════════════════════════════════════════════════════════════════
# identity-service — THE CITIZEN'S ENTIRE WORLD, plus the DPO surface.
#
# HAND-AUTHORED from four controllers and src/main.ts at backend SHA 06d9f9b.
#
# x-usrp-verified levels used in this document:
#   controller-verbatim  request and response shapes transcribed from the named
#                        controller file, field by field
#   proxy-derived        the ENVELOPE is verbatim, but the payload is proxied
#                        from another service through a gateway port this pass
#                        did not open. The element shape is stated as the other
#                        service's contract, and that link is an assumption
#                        recorded rather than hidden.
# ════════════════════════════════════════════════════════════════
openapi: "3.1.0"

info:
  title: "USRP identity-service"
  version: "1.0.0"
  description: >-
    Three unrelated jobs live in one service, and conflating them is the fastest
    way to build the wrong client:


    1. NIDA identity verification (system OR officer token).

    2. The CITIZEN's own authentication and self-service (ADR-018/ADR-020) — OTP
    request/verify, an opaque revocable session, their applications, their
    withdrawal, their erasure demand.

    3. The officer/DPO erasure surface (ADR-015) — the accountable human road.


    THE CITIZEN CREDENTIAL IS NOT A JWT AND NOT A COOKIE. otp/verify returns
    { sessionToken, expiresAt } in a JSON body: a 32-byte opaque handle to a row
    in public_core.applicant_sessions with a 30-minute sliding TTL, validated
    LIVE on every request so revocation is honoured immediately. Nothing sets a
    Set-Cookie header. A frontend built on httpOnly cookies has no server in
    this system that will implement it.


    THE TWO CREDENTIAL KINDS FAIL DIFFERENTLY ON THE SAME SERVICE. Officer and
    system JWTs fail 401 { error: "UNAUTHENTICATED" } via withAuth. The citizen
    session fails 401 { error: "INVALID_SESSION" }. Same status, different code,
    same service, and no route accepts both.


    THE RAW NATIONAL ID IS REQUEST-ONLY and nationalIdHash appears in NO
    response in this document. The hash is an internal cross-service key; a
    browser that computes or receives one is a leak of a cross-service join key.
  x-usrp-backend-sha: "cd4962842e26177f179eb3c0bd51c214dad3fd61"
  x-usrp-service-port-var: "PORT_IDENTITY_SERVICE"
  x-usrp-transport-faults:
    - status: 405
      code: "METHOD_NOT_ALLOWED"
      note: "Route table is keyed (path -> method). Carries an Allow header."
    - status: 413
      code: "PAYLOAD_TOO_LARGE"
      note: "Body-parsing operations only."
    - status: 415
      code: "UNSUPPORTED_MEDIA_TYPE"
      note: "Body-parsing operations only."
    - status: 400
      code: "MALFORMED_JSON"
      note: "Body-parsing operations only. Also EMPTY_BODY."

paths:
  # ───────────────────────────────────────────────────────────────
  # 1. NIDA identity verification
  # ───────────────────────────────────────────────────────────────

  /v1/identities/verify:
    post:
      operationId: "verifyIdentity"
      summary: "Resolve a National ID against NIDA to an opaque applicant UUID"
      description: >-
        ACCEPTS TWO PRINCIPAL KINDS, which is unusual and deliberate:
        withAuth(verify, { kind: ['system','officer'] }). system is the
        pre-registered digital flow; officer is the walk-in lane's on-site NIDA
        lookup at the exam venue (ADR-012). The caller kind changes nothing
        below the edge.


        THE RESPONSE RETURNS ONLY applicantId. Not the name, not the DOB, not
        the gender, not the nationalIdHash. The old frontend's walk-in hook
        asked the BROWSER to compute nationalIdHash — that is not a shape
        mismatch, it is a request to leak the platform's cross-service join key
        into a bundle.


        `channel` IS REQUIRED. Omitting it is 400 INVALID_CHANNEL, so a client
        that does not send one fails 100% of the time.


        422 NOT_A_CITIZEN IS UNPROVEN. No selfcheck exercises it and the NIDA
        mock ships no non-citizen fixture, so this branch is documented from
        source and has never been observed over a socket. It gates eligibility
        for the whole platform.
      x-usrp-auth: ["system", "officer"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/adapters/http/verify-identity.controller.ts (VERIFY_IDENTITY_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyIdentityRequest"
      responses:
        "201":
          description: "A new applicant identity was created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityCreated201"
        "200":
          description: >-
            Idempotent replay — this identity already existed. Same applicantId
            as the original 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityAlreadyExists200"
        "400":
          description: >-
            Three distinct codes on `error`: MISSING_NATIONAL_ID (field absent
            or blank), INVALID_CHANNEL (not one of the four), and
            INVALID_NATIONAL_ID (present, well-shaped at the edge, rejected by
            the domain's checksum). The third is a real judgement about the
            number and must not be rendered as "please fill in this field".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyIdentity400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Authenticated but neither system nor officer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "NOT_FOUND_IN_NIDA — the register has no such number."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundInNida404"
        "422":
          description: "NOT_A_CITIZEN. Found in NIDA, not a citizen. UNPROVEN branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotACitizen422"
        "503":
          description: >-
            NIDA_UNAVAILABLE — a G2G fault, retryable. The `detail` written in
            source is discarded on the wire (expose = status < 500).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NidaUnavailable503"
        "500":
          description: "IDENTITY_PERSISTENCE_ERROR or INTERNAL_ERROR. Detail withheld."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityError500"

  # ───────────────────────────────────────────────────────────────
  # 2. Citizen authentication (ADR-018) — PUBLIC, then session-bearing
  # ───────────────────────────────────────────────────────────────

  /v1/gate/admissions:
    post:
      operationId: "admitAtGate"
      summary: "Admit a candidate at the venue gate — the gate's front door (BUILD-003, ADR-034)"
      description: >-
        OFFICER, admission.gate. identity-service is the front door only because
        it alone holds NATIONAL_ID_HMAC_KEY: it hashes the national ID typed from
        the card, forgets the number, and forwards { qrToken, gateVenueName,
        nationalIdHash } to application-service under the officer's OWN bearer
        token. It decides nothing; the answer is rebuilt from a closed allowlist
        and anything off-contract is a 502. The raw national ID is never
        stored, logged or returned.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/gate-admission.controller.ts (GATE_ADMISSIONS_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GateAdmissionRequest"
      responses:
        "200":
          description: "Admitted; the QR is now spent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateAdmitted200"
        "400":
          description: "INVALID_REQUEST (shape)."
        "401":
          description: "No or invalid officer token."
        "403":
          description: "PERMISSION_DENIED — only admission.gate (the screening post) admits."
        "409":
          description: "A real ticket refused here and now."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateConflict409"
        "422":
          description: "INVALID_TICKET."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GateInvalidTicket422"
        "502":
          description: "UPSTREAM_CONTRACT_MISMATCH — an off-contract answer is never relayed."
        "503":
          description: "UPSTREAM_UNAVAILABLE."

  /v1/applicants/auth/onboarding/begin:
    post:
      operationId: "beginApplicantOnboarding"
      summary: "Confirm National ID + date of birth against NIDA (onboarding step 1)"
      description: >-
        UNAUTHENTICATED. STEP 1 OF NID → DOB → PHONE → OTP (ADR-029).


        The National ID and the date of birth are checked against NIDA's own
        record: the person must be a Rwandan citizen AND the date of birth must
        match. On success the identity row is created or reused and a signed,
        short-lived (15 min) onboarding token is returned. The token is NOT a
        session; it only authorises the phone and OTP steps.


        THE DATE OF BIRTH IS THE SECOND FACTOR. The OTP proves control of a
        phone the citizen names, not that the phone belongs to the National ID's
        owner; NIDA holds no phone. Without this factor anyone who merely knows a
        National ID could enrol their own phone against it.


        ONE 422 IDENTITY_NOT_CONFIRMED covers an unknown National ID, a
        non-citizen, a wrong date of birth AND a temporarily locked National ID.
        Do not build copy that distinguishes them. Five mismatches lock the ID
        for an hour, durably.
      x-usrp-auth: ["none"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ONBOARDING_BEGIN_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingBeginBody"
      responses:
        "200":
          description: "Confirmed. Keep the token in memory; it is never stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingBegun200"
        "400":
          description: "Shape errors: nationalId, dateOfBirth (YYYY-MM-DD, a real date), channel."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuth400"
        "422":
          description: "IDENTITY_NOT_CONFIRMED. One shape for every cause."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityNotConfirmed422"
        "502":
          description: "UPSTREAM_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"
        "503":
          description: "NIDA_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NidaUnavailable503"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/applicants/auth/otp/request:
    post:
      operationId: "requestApplicantOtp"
      summary: "Send a one-time code to the phone number the citizen stated (step 2)"
      description: >-
        UNAUTHENTICATED. Requires the onboarding token from step 1 and the
        phone number the citizen TYPED — NIDA holds no phone, so the number is
        never derived from the National ID.


        Only MTN Rwanda (078/079) and Airtel Rwanda (072/073) mobile numbers are
        accepted. A number the system cannot deliver to is a 400
        INVALID_PHONE_NUMBER; that reveals nothing about the citizen. An
        expired or forged onboarding token is a 401 ONBOARDING_EXPIRED.


        THE 202 IS UNIFORM: it says the request was accepted, not that an SMS
        was sent. The stored OTP digest is bound to the phone, so a code sent to
        one number cannot verify another.


        The raw phone number is never returned. Neither is the code.
      x-usrp-auth: ["none"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (OTP_REQUEST_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestBody"
      responses:
        "202":
          description: "Uniform. See the description — this says nothing about the input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenged202"
        "400":
          description: >-
            Shape errors: INVALID_REQUEST (onboardingToken/phoneNumber absent or
            oversized), INVALID_CHANNEL, INVALID_PHONE_NUMBER (not a deliverable
            MTN/Airtel Rwanda number).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuth400"
        "401":
          description: "ONBOARDING_EXPIRED — start again from step 1."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingExpired401"
        "502":
          description: "UPSTREAM_UNAVAILABLE — a dependent service is down."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"
        "503":
          description: "NIDA_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NidaUnavailable503"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/applicants/auth/otp/verify:
    post:
      operationId: "verifyApplicantOtp"
      summary: "Exchange the one-time code for an opaque session token"
      description: >-
        UNAUTHENTICATED. THE ONLY PLACE THE SESSION TOKEN EVER APPEARS. It is
        returned once, in this body, and never again by any endpoint. It is not
        logged. If the client loses it the citizen must re-authenticate.


        EVERY FAILURE IS ONE BYTE-IDENTICAL 401 INVALID_OTP: wrong code, expired
        code, no challenge outstanding, unknown national id. Do not build copy
        that distinguishes them.


        Requires the onboarding token, the SAME phone number the code was sent
        to, and channel alongside otp. The code is bound to that number.
      x-usrp-auth: ["none"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (OTP_VERIFY_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyBody"
      responses:
        "200":
          description: "Authenticated. Store the sessionToken; it is never reissued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSessionIssued200"
        "400":
          description: "Shape errors, as for otp/request, plus a missing/oversized otp."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuth400"
        "401":
          description: "INVALID_OTP. One shape for every cause."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidOtp401"
        "502":
          description: "UPSTREAM_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"
        "503":
          description: "NIDA_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NidaUnavailable503"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/applicants/auth/logout:
    post:
      operationId: "logoutApplicant"
      summary: "Revoke the current citizen session"
      description: >-
        THIS ROUTE IS ABSENT FROM EVERY EARLIER SURVEY OF THIS API, and it is
        the thing that makes the opaque-session choice worth its cost: an
        officer JWT cannot be revoked before expiry, a citizen session can be,
        and this is the door that does it.


        It authenticates FIRST and revokes second, so a bogus token cannot be
        used to probe. Returns 204 WITH NO BODY — a client that unconditionally
        parses JSON on this response will throw on success.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (LOGOUT_PATH)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "204":
          description: "Session revoked. NO BODY."
        "401":
          description: "INVALID_SESSION — absent, malformed, expired or already revoked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/applicants/me/applications:
    get:
      operationId: "listMyApplications"
      summary: "The citizen's own applications, across all three agencies"
      description: >-
        SESSION-AUTHENTICATED. THE APPLICANT ID IS NEVER A PARAMETER — it is
        derived from the session inside the handler, so there is no shape of
        this request that can ask about somebody else.


        Cross-agency by design: identity-service proxies to application-service
        GET /v1/applications/by-applicant with its OWN client-credentials token
        (the ADR-016/ADR-018 pattern). An officer token cannot reach that
        route, which is why the citizen door cannot be per-agency.


        WHAT THIS DOES NOT RETURN, AND WHY IT MATTERS: status and nothing
        actionable. When status is SLOT_ASSIGNED the citizen learns that a slot
        exists and cannot learn WHERE or WHEN. There is no endpoint in the
        platform that tells them. That is the most consequential read gap for an
        actual applicant and it is specced in openapi/proposed/.


        NOTHING PAGINATES. No total, no cursor, no limit parameter. The
        deprecated frontend's PaginatedResult<T> has no counterpart anywhere in
        this platform.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ME_APPLICATIONS_PATH)"
      x-usrp-verified: "proxy-derived"
      responses:
        "200":
          description: "The citizen's applications. Element shape is application-service's."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyApplicationsOk"
        "401":
          description: "INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "502":
          description: >-
            UPSTREAM_UNAVAILABLE — application-service is unreachable. Distinct
            from 500: the citizen's own data is fine, the hop failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

    post:
      operationId: "submitMyApplication"
      summary: "Submit the citizen's own application"
      description: >-
        SESSION-AUTHENTICATED. The applicant identity and browser channel are
        derived from the session and cannot be supplied by the client. The
        Idempotency-Key header is required so a reconnect cannot create a second
        application after an uncertain response.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ME_APPLICATIONS_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: "Application filed for the first time."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitApplicationResponse"
        "200":
          description: "Idempotent replay of the original filing response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitApplicationResponse"
        "400":
          description: "Invalid request or forbidden identity/channel field."
        "401":
          description: "No applicant session."
        "409":
          description: "Already applied or a business conflict."
        "422":
          description: "Idempotency key reuse or academic-input validation failure."
        "429":
          description: "Submission rate limit exceeded."
        "503":
          description: "Dependency failure."

  /v1/applicants/me/applications/exam-invitation:
    get:
      operationId: "getMyExamInvitation"
      summary: "The citizen's downloadable exam QR for one of their applications (ADR-033)"
      description: >-
        SESSION-AUTHENTICATED. The subject is the session; another citizen's
        application is 404. The QR (the signed slot invitation) is present only
        once a slot is assigned and while it is valid; every other state is
        reported without a payload.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ME_EXAM_INVITATION_PATH)"
      x-usrp-verified: "controller-verbatim"
      parameters:
        - name: "applicationId"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: "The state, and the invitation when READY."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamInvitationView"
        "400":
          description: "applicationId is absent or not a UUID."
        "401":
          description: "No applicant session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "404":
          description: "Not this citizen's application."
        "502":
          description: "application-service unavailable or malformed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"

  /v1/applicants/me/applications/document-checklist:
    get:
      operationId: "getMyDocumentChecklist"
      summary: "The citizen's advisory document checklist for one of their applications (ADR-032)"
      description: >-
        SESSION-AUTHENTICATED. The subject is the session; another citizen's
        application and a nonexistent one are the same 404. ADVISORY — it
        never blocks the application. An automated registry verification
        satisfies an item without any upload.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ME_DOCUMENT_CHECKLIST_PATH)"
      x-usrp-verified: "controller-verbatim"
      parameters:
        - name: "applicationId"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: "The checklist."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentChecklist200"
        "400":
          description: "applicationId is absent or not a UUID."
        "401":
          description: "No applicant session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "404":
          description: "Not this citizen's application."
        "502":
          description: "application-service unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"

  /v1/applicants/me/applications/documents:
    post:
      operationId: "uploadMyDocument"
      summary: "Upload a document for the citizen's own application"
      description: >-
        SESSION-AUTHENTICATED, multipart/form-data. The applicant is derived
        from the session; an `applicantId` part is REFUSED (400). Parts:
        applicationId (uuid), documentType, and one `file` part (the browser
        filename is ignored).


        THE RESPONSE NEVER CARRIES A VERDICT: no lane, score or flag. A forensics
        score handed to the uploader is a forgery-tuning oracle. The only
        specific refusal is malware, which teaches a forger nothing.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-documents.controller.ts (ME_DOCUMENTS_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadDocumentForm"
      responses:
        "201":
          description: "Stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploaded201"
        "400":
          description: "Shape error, missing/empty file, or a forbidden applicantId part."
        "401":
          description: "No applicant session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "404":
          description: "APPLICATION_NOT_FOUND — absent, or not this citizen's (same answer)."
        "409":
          description: "NOT_ACCEPTING_DOCUMENTS."
        "413":
          description: "FILE_TOO_LARGE."
        "422":
          description: "Unsupported type/content, content-type mismatch, or malware."
        "502":
          description: "A dependent service is unavailable; nothing was stored."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"

  /v1/applicants/me/applications/withdraw:
    post:
      operationId: "withdrawMyApplication"
      summary: "The citizen withdraws their own application (ADR-020)"
      description: >-
        SESSION-AUTHENTICATED. The body carries applicationId ONLY; the
        applicant identity comes from the session and travels with the proxied
        call, so this door can only move the caller's own row.


        NOT-MINE AND NOT-REAL ARE THE SAME 404. Ownership is the row lookup
        (WHERE id = X AND applicant_id = Y FOR UPDATE), so the door is
        deliberately not an ownership oracle. Do not write copy that implies the
        application exists but belongs to someone else.


        ALREADY-WITHDRAWN IS A 200 NO_CHANGE, not an error: idempotent, no
        writes, no audit row. A client that treats only WITHDRAWN as success
        will show a failure for a repeat click that did exactly what was asked.


        409 NOT_APPLICABLE carries currentStatus and means the application is
        terminal (ACCEPTED, REJECTED, WALK_IN_REJECTED). That is the only place
        this route explains itself.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/applicant-auth.controller.ts (ME_WITHDRAW_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawMineRequest"
      responses:
        "200":
          description: >-
            WITHDRAWN (with fromStatus) or NO_CHANGE (idempotent). Discriminated
            on `status` — two different bodies on one status code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawMineOk200"
        "400":
          description: "INVALID_REQUEST — applicationId is not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuth400"
        "401":
          description: "INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "404":
          description: "NOT_FOUND. Also the answer for another citizen's real application."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawNotFound404"
        "409":
          description: "NOT_APPLICABLE — terminal state, with currentStatus."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawNotApplicable409"
        "502":
          description: "UPSTREAM_UNAVAILABLE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamUnavailable502"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/applicants/me/erasure-request:
    post:
      operationId: "fileMyErasureRequest"
      summary: "The data subject files a right-to-erasure demand"
      description: >-
        SESSION-AUTHENTICATED. 202 BOTH WAYS: filing is idempotent, so a live
        request is RETURNED rather than duplicated, and the response cannot tell
        you which happened. A client must not report "request submitted" versus
        "already submitted" — it does not know.


        Filing is not execution. A human decides next; execution runs down the
        gated ADR-015 erasure road.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/erasure-request.controller.ts (ME_ERASURE_REQUEST_PATH)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "202":
          description: "On record, pending a human decision. Same body for a fresh or existing request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequestFiled202"
        "401":
          description: "INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"
    get:
      operationId: "getMyErasureRequest"
      summary: "The data subject reads the status of their own demand"
      description: >-
        SESSION-AUTHENTICATED. SHARES ITS PATH WITH THE POST — shared-http keys
        its table by (path -> method), so both coexist on one exact path.


        404 { status: "NONE" } MEANS "YOU HAVE NEVER FILED ONE". It is not an
        error and not a missing page; it is the normal state for almost every
        citizen. Rendering it as a failure is wrong.


        decisionNote is the DPO's stated ground and is deliberately exposed to
        the citizen — it answers THEIR demand.
      x-usrp-auth: ["applicant-session"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/erasure-request.controller.ts (ME_ERASURE_REQUEST_PATH)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "200":
          description: "The citizen's request record."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyErasureRequestOk"
        "401":
          description: "INVALID_SESSION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidSession401"
        "404":
          description: "NONE — never filed. A normal state, not a fault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequestNone404"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  # ───────────────────────────────────────────────────────────────
  # 3. Officer / DPO erasure surface (ADR-015)
  # ───────────────────────────────────────────────────────────────

  /v1/identities/erasure:
    post:
      operationId: "eraseIdentity"
      summary: "Execute an erasure against an applicant identity"
      description: >-
        OFFICER-ONLY — an accountable human, never a system token. THE BODY
        TAKES ONLY applicantId. A raw national id is not accepted here;
        resolving one is the verify road's job.


        BOTH 409s ARE LAWFUL REFUSALS, NOT ERRORS. An active application or a
        cross-agency accept-lock outranks the erasure demand, and the response
        names the agency responsible so the DPO can explain the refusal to the
        data subject. This is the surface where a legal right meets a legal
        retention duty, and flattening the two refusals loses which duty won.


        ALREADY_ERASED is a 200, not a 404: the demanded end-state holds.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/erasure.controller.ts (ERASURE_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EraseIdentityRequest"
      responses:
        "200":
          description: "ERASED or ALREADY_ERASED — discriminated on `status`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EraseOk200"
        "400":
          description: "INVALID_APPLICANT_ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApplicantId400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal — a system token lands here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "NOT_FOUND — no such applicant identity."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureNotFound404"
        "409":
          description: >-
            REFUSED_ACTIVE_APPLICATION (with agency + currentStatus) or
            REFUSED_ACCEPT_LOCKED (with lockedByAgency). Different grounds,
            different fields, one status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EraseRefused409"
        "500":
          description: "IDENTITY_PERSISTENCE_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityError500"

  /v1/identities/erasure-requests:
    get:
      operationId: "listErasureRequests"
      summary: "The DPO's pending-request queue"
      description: >-
        OFFICER-ONLY. TAKES NO PARAMETERS and is NOT agency-scoped: erasure is a
        platform-level data-protection duty, not an agency workflow, so this
        queue is every pending request. Note this differs from every officer
        read on application-service, which are RLS-scoped to the caller's own
        agency.


        Returns applicantId — an opaque UUID and the only identifier a DPO gets.
        No name, no national id, no hash. Deciding an erasure demand from this
        queue means deciding it without knowing who the person is, by design.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/erasure-request.controller.ts (ERASURE_REQUESTS_QUEUE_PATH)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "200":
          description: "Pending requests. No total, no pagination."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureQueueOk"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /v1/identities/erasure-requests/decline:
    post:
      operationId: "declineErasureRequest"
      summary: "The DPO refuses an erasure demand, on the record"
      description: >-
        OFFICER-ONLY. `note` IS MANDATORY (1..200 chars, non-blank) — a refusal
        without a stated ground is not accepted by the API. The UI cannot make
        that field optional; a blank note is a 400.


        THERE IS NO APPROVE ROUTE, AND THAT IS INTENTIONAL. Approval is not a
        decision recorded here — execution IS the gated erasure road above
        (POST /v1/identities/erasure), which stamps the request through the use
        case. A DPO console with an "Approve" button pointing at this controller
        is targeting an endpoint that does not exist.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/erasure-request.controller.ts (ERASURE_REQUEST_DECLINE_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineErasureRequest"
      responses:
        "200":
          description: "DECLINED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureDeclined200"
        "400":
          description: "INVALID_REQUEST — requestId not a UUID, or note absent/blank/over 200."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuth400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "NOT_FOUND — no such request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureNotFound404"
        "409":
          description: >-
            NOT_PENDING — already decided. Carries currentStatus so the UI can
            say which way it went instead of just refusing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureNotPending409"
        "500":
          description: "PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAuthError500"

  /health:
    get:
      operationId: "identityHealth"
      summary: "Liveness"
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "@usrp/shared-http (reserved probe)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Process is up."

  /ready:
    get:
      operationId: "identityReady"
      summary: "Readiness — database reachable"
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/main.ts (readiness callback)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Database reachable."
        "503":
          description: "Database unreachable."

components:
  schemas:
    GateAdmissionRequest:
      type: "object"
      additionalProperties: false
      required: ["qrToken", "nationalId", "gateVenueName"]
      properties:
        qrToken:
          description: "The QR text as scanned (USRP-SLOT.v1…)."
          type: "string"
          minLength: 1
          maxLength: 4096
        nationalId:
          description: "Typed from the physical card. Hashed by identity-service; never stored or returned."
          type: "string"
          pattern: "^[0-9]{16}$"
        gateVenueName:
          type: "string"
          minLength: 1
          maxLength: 200

    GateCandidate:
      description: "The candidate as the gate officer needs them: public identifiers only."
      type: "object"
      additionalProperties: false
      required: ["applicationId", "processingCode", "category"]
      properties:
        applicationId:
          type: "string"
          format: "uuid"
        processingCode:
          type: "string"
          minLength: 1
          maxLength: 32
        category:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"

    GateAdmitted200:
      type: "object"
      additionalProperties: false
      required: ["outcome", "candidate", "venueName", "examDate", "reportingTimeHour", "admittedAt", "statusAdvanced"]
      properties:
        outcome:
          type: "string"
          const: "ADMITTED"
        candidate:
          $ref: "#/components/schemas/GateCandidate"
        venueName:
          type: "string"
          minLength: 1
          maxLength: 200
        examDate:
          type: "string"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        reportingTimeHour:
          type: "integer"
          minimum: 0
          maximum: 23
        admittedAt:
          type: "string"
          format: "date-time"
        statusAdvanced:
          description: "true when this admission moved SLOT_ASSIGNED to PHYSICAL_TEST_SCHEDULED."
          type: "boolean"

    GateAlreadyAdmitted409:
      description: "The QR was already spent. Checked before venue and day, so a copied screenshot is a duplicate at any gate."
      type: "object"
      additionalProperties: false
      required: ["error", "candidate", "admittedAt", "venueName", "admittedBySelf"]
      properties:
        error:
          type: "string"
          const: "ALREADY_ADMITTED"
        candidate:
          $ref: "#/components/schemas/GateCandidate"
        admittedAt:
          type: "string"
          format: "date-time"
        venueName:
          description: "Where the first admission happened."
          type: "string"
        admittedBySelf:
          type: "boolean"

    GateNotAdmissible409:
      type: "object"
      additionalProperties: false
      required: ["error", "candidate", "currentStatus"]
      properties:
        error:
          type: "string"
          const: "NOT_ADMISSIBLE"
        candidate:
          $ref: "#/components/schemas/GateCandidate"
        currentStatus:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]{0,63}$"

    GateIdentityMismatch409:
      description: "The national ID on the card is not this applicant's. Audited."
      type: "object"
      additionalProperties: false
      required: ["error", "candidate"]
      properties:
        error:
          type: "string"
          const: "IDENTITY_MISMATCH"
        candidate:
          $ref: "#/components/schemas/GateCandidate"

    GateWrongVenue409:
      type: "object"
      additionalProperties: false
      required: ["error", "ticketVenueName"]
      properties:
        error:
          type: "string"
          const: "WRONG_VENUE"
        ticketVenueName:
          type: "string"

    GateWrongDay409:
      description: "TOO_EARLY or EXPIRED: today in Africa/Kigali is not the exam day."
      type: "object"
      additionalProperties: false
      required: ["error", "examDate"]
      properties:
        error:
          type: "string"
          enum: ["TOO_EARLY", "EXPIRED"]
        examDate:
          type: "string"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    GateConflict409:
      oneOf:
        - $ref: "#/components/schemas/GateAlreadyAdmitted409"
        - $ref: "#/components/schemas/GateNotAdmissible409"
        - $ref: "#/components/schemas/GateIdentityMismatch409"
        - $ref: "#/components/schemas/GateWrongVenue409"
        - $ref: "#/components/schemas/GateWrongDay409"

    GateInvalidTicket422:
      description: "The QR is not a ticket of this agency: malformed, another agency's, unknown, or not the stored (signed) token."
      type: "object"
      additionalProperties: false
      required: ["error", "reason"]
      properties:
        error:
          type: "string"
          const: "INVALID_TICKET"
        reason:
          type: "string"
          enum: ["MALFORMED_TICKET", "WRONG_AGENCY", "UNKNOWN_TICKET", "TICKET_NOT_ISSUED"]

    Uuid:
      type: "string"
      format: "uuid"
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

    Agency:
      type: "string"
      enum: ["RDF", "RNP", "RCS"]

    ApplicationChannel:
      description: >-
        REQUIRED on both verify and OTP request/verify. 400 INVALID_CHANNEL
        otherwise. Source: APPLICATION_CHANNELS in backend shared-types.
      type: "string"
      enum: ["WEB", "USSD", "IREMBO_KIOSK", "WALK_IN"]

    ApplicationStatus:
      description: >-
        All 19 states. Per-agency legality is NOT expressible in OpenAPI —
        rnp_ops and rcs_ops carry no WALK_IN_* values. Use StatusFor<Agency>
        from src/agency.ts to constrain by agency at compile time.
      type: "string"
      enum:
        - "DRAFT"
        - "SUBMITTED"
        - "ACADEMIC_VETTING"
        - "CRIMINAL_CLEARANCE"
        - "DOCUMENT_REVIEW_GREEN"
        - "DOCUMENT_REVIEW_AMBER"
        - "SLOT_ASSIGNED"
        - "PHYSICAL_TEST_SCHEDULED"
        - "PHYSICAL_TEST_COMPLETE"
        - "MEDICAL_REVIEW"
        - "FINAL_SHORTLIST"
        - "ACCEPTED"
        - "ADJUDICATION_REVIEW"
        - "REJECTED"
        - "WITHDRAWN"
        - "WALK_IN_REGISTERED"
        - "WALK_IN_ON_SITE_VETTING"
        - "WALK_IN_PHYSICAL_TEST"
        - "WALK_IN_REJECTED"

    RawNationalId:
      description: >-
        REQUEST-ONLY. This schema is referenced by request bodies and by NO
        response in this document. If it ever appears under a response, that is
        the bug invariant 2 exists to catch.
      type: "string"
      minLength: 1
      maxLength: 32

    VerifyIdentityRequest:
      type: "object"
      additionalProperties: false
      required: ["nationalId", "channel"]
      properties:
        nationalId:
          $ref: "#/components/schemas/RawNationalId"
        channel:
          $ref: "#/components/schemas/ApplicationChannel"

    OnboardingBeginBody:
      type: "object"
      additionalProperties: false
      required: ["nationalId", "dateOfBirth", "channel"]
      properties:
        nationalId:
          $ref: "#/components/schemas/RawNationalId"
        dateOfBirth:
          description: "A real calendar date, YYYY-MM-DD. Compared to NIDA's record; never stored or echoed."
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        channel:
          $ref: "#/components/schemas/ApplicationChannel"

    OnboardingBegun200:
      type: "object"
      additionalProperties: false
      required: ["onboardingToken", "expiresAt"]
      properties:
        onboardingToken:
          description: "Signed, 15-minute, not a session. Keep in memory only."
          type: "string"
          maxLength: 512
        expiresAt:
          type: "string"
          format: "date-time"

    IdentityNotConfirmed422:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "IDENTITY_NOT_CONFIRMED"
        detail:
          type: "string"

    OnboardingExpired401:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "ONBOARDING_EXPIRED"
        detail:
          type: "string"

    OtpRequestBody:
      type: "object"
      additionalProperties: false
      required: ["onboardingToken", "phoneNumber", "channel"]
      properties:
        onboardingToken:
          type: "string"
          minLength: 1
          maxLength: 512
        phoneNumber:
          description: "As typed: 07XXXXXXXX, 2507XXXXXXXX or +2507XXXXXXXX (spaces/hyphens allowed)."
          type: "string"
          minLength: 1
          maxLength: 32
        channel:
          $ref: "#/components/schemas/ApplicationChannel"

    OtpVerifyBody:
      type: "object"
      additionalProperties: false
      required: ["onboardingToken", "phoneNumber", "otp", "channel"]
      properties:
        onboardingToken:
          type: "string"
          minLength: 1
          maxLength: 512
        phoneNumber:
          type: "string"
          minLength: 1
          maxLength: 32
        otp:
          description: "Max 12 chars. Never echoed, never logged."
          type: "string"
          minLength: 1
          maxLength: 12
        channel:
          $ref: "#/components/schemas/ApplicationChannel"

    WithdrawMineRequest:
      description: >-
        applicationId ONLY. There is no applicantId field, by design — see the
        operation description.
      type: "object"
      additionalProperties: false
      required: ["applicationId"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"

    EraseIdentityRequest:
      type: "object"
      additionalProperties: false
      required: ["applicantId"]
      properties:
        applicantId:
          $ref: "#/components/schemas/Uuid"

    DeclineErasureRequest:
      type: "object"
      additionalProperties: false
      required: ["requestId", "note"]
      properties:
        requestId:
          $ref: "#/components/schemas/Uuid"
        note:
          description: "MANDATORY. Non-blank, max 200 (decision_note varchar(200))."
          type: "string"
          minLength: 1
          maxLength: 200

    IdentityCreated201:
      type: "object"
      additionalProperties: false
      required: ["status", "applicantId"]
      properties:
        status:
          type: "string"
          const: "CREATED"
        applicantId:
          description: >-
            The OPAQUE applicant UUID. This is the entire payload — no name, no
            DOB, no gender, and above all no nationalIdHash.
          $ref: "#/components/schemas/Uuid"

    IdentityAlreadyExists200:
      type: "object"
      additionalProperties: false
      required: ["status", "applicantId"]
      properties:
        status:
          type: "string"
          const: "ALREADY_EXISTS"
        applicantId:
          $ref: "#/components/schemas/Uuid"

    NotFoundInNida404:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NOT_FOUND_IN_NIDA"

    NotACitizen422:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NOT_A_CITIZEN"

    OtpChallenged202:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "CHALLENGED"

    ApplicantSessionIssued200:
      type: "object"
      additionalProperties: false
      required: ["sessionToken", "expiresAt"]
      properties:
        sessionToken:
          description: >-
            An OPAQUE 32-byte handle, not a JWT. Do not attempt to decode it;
            there is nothing inside. 30-minute SLIDING TTL, revalidated live on
            every request, revocable via logout (ADR-018).
          type: "string"
        expiresAt:
          description: >-
            The CURRENT expiry. Because the TTL slides, this value is stale the
            moment the next authenticated request lands. Do not build a
            countdown from it and call it accurate.
          type: "string"
          format: "date-time"

    ApplicantApplicationSummary:
      description: >-
        PROXIED from application-service GET /v1/applications/by-applicant. This
        is that service's ApplicantApplicationSummary; the link is stated, not
        re-derived, and the operation is marked proxy-derived because this pass
        did not open adapters/applications.http-gateway.ts.
      type: "object"
      additionalProperties: false
      required:
        ["applicationId", "processingCode", "category", "status", "submittedAt", "agency"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          description: "e.g. RDF-90823. The citizen's public handle for the application."
          type: "string"
        category:
          type: "string"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submittedAt:
          type: ["string", "null"]
          format: "date-time"
        agency:
          $ref: "#/components/schemas/Agency"

    MyApplicationsOk:
      type: "object"
      additionalProperties: false
      required: ["applications"]
      properties:
        applications:
          description: "No total, no cursor. Nothing in this platform paginates."
          type: "array"
          items:
            $ref: "#/components/schemas/ApplicantApplicationSummary"

    WithdrawnOk:
      type: "object"
      additionalProperties: false
      required: ["status", "agency", "fromStatus"]
      properties:
        status:
          type: "string"
          const: "WITHDRAWN"
        agency:
          $ref: "#/components/schemas/Agency"
        fromStatus:
          description: "What it was withdrawn FROM. The only place this is reported."
          $ref: "#/components/schemas/ApplicationStatus"

    WithdrawNoChangeOk:
      description: "Idempotent success — already WITHDRAWN. No writes, no audit row."
      type: "object"
      additionalProperties: false
      required: ["status", "agency"]
      properties:
        status:
          type: "string"
          const: "NO_CHANGE"
        agency:
          $ref: "#/components/schemas/Agency"

    WithdrawMineOk200:
      oneOf:
        - $ref: "#/components/schemas/WithdrawnOk"
        - $ref: "#/components/schemas/WithdrawNoChangeOk"
      discriminator:
        propertyName: "status"

    WithdrawNotFound404:
      description: "Bare. Not an ownership oracle — see the operation description."
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NOT_FOUND"

    WithdrawNotApplicable409:
      type: "object"
      additionalProperties: false
      required: ["status", "agency", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "NOT_APPLICABLE"
        agency:
          $ref: "#/components/schemas/Agency"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    ErasureRequestFiled202:
      type: "object"
      additionalProperties: false
      required: ["status", "requestId"]
      properties:
        status:
          type: "string"
          const: "PENDING"
        requestId:
          $ref: "#/components/schemas/Uuid"

    MyErasureRequestOk:
      description: >-
        NOTE the shape: no `status` discriminator wrapper, unlike every sibling.
        `status` here is the REQUEST's lifecycle state, not an outcome code.
      type: "object"
      additionalProperties: false
      required: ["requestId", "status", "requestedAt", "decidedAt", "decisionNote"]
      properties:
        requestId:
          $ref: "#/components/schemas/Uuid"
        status:
          description: >-
            The stored request status. Typed string rather than an enum: the
            controller passes record.status through untouched and the enum is
            not visible at the transport layer. Narrowing it would be a guess.
          type: "string"
        requestedAt:
          type: "string"
          format: "date-time"
        decidedAt:
          type: ["string", "null"]
          format: "date-time"
        decisionNote:
          description: "The DPO's ground. Exposed to the citizen deliberately."
          type: ["string", "null"]

    ErasureRequestNone404:
      description: "Never filed. A normal state for almost every citizen."
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NONE"

    ErasureQueueEntry:
      type: "object"
      additionalProperties: false
      required: ["requestId", "applicantId", "requestedAt"]
      properties:
        requestId:
          $ref: "#/components/schemas/Uuid"
        applicantId:
          description: "Opaque. The DPO decides without learning who the person is."
          $ref: "#/components/schemas/Uuid"
        requestedAt:
          type: "string"
          format: "date-time"

    ErasureQueueOk:
      type: "object"
      additionalProperties: false
      required: ["requests"]
      properties:
        requests:
          type: "array"
          items:
            $ref: "#/components/schemas/ErasureQueueEntry"

    ErasureDeclined200:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "DECLINED"

    ErasureNotPending409:
      type: "object"
      additionalProperties: false
      required: ["status", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "NOT_PENDING"
        currentStatus:
          type: "string"

    ErasureNotFound404:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NOT_FOUND"

    ErasedOk:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "ERASED"

    AlreadyErasedOk:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "ALREADY_ERASED"

    EraseOk200:
      oneOf:
        - $ref: "#/components/schemas/ErasedOk"
        - $ref: "#/components/schemas/AlreadyErasedOk"
      discriminator:
        propertyName: "status"

    RefusedActiveApplication409:
      type: "object"
      additionalProperties: false
      required: ["status", "agency", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "REFUSED_ACTIVE_APPLICATION"
        agency:
          $ref: "#/components/schemas/Agency"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    RefusedAcceptLocked409:
      type: "object"
      additionalProperties: false
      required: ["status", "lockedByAgency"]
      properties:
        status:
          type: "string"
          const: "REFUSED_ACCEPT_LOCKED"
        lockedByAgency:
          $ref: "#/components/schemas/Agency"

    EraseRefused409:
      oneOf:
        - $ref: "#/components/schemas/RefusedActiveApplication409"
        - $ref: "#/components/schemas/RefusedAcceptLocked409"
      discriminator:
        propertyName: "status"

    SubmitApplicationRequest:
      type: "object"
      additionalProperties: false
      required: ["category", "campaignCode"]
      properties:
        category:
          type: "string"
          maxLength: 64
        campaignCode:
          description: >-
            The PUBLIC code of the campaign the citizen chose (from the public
            campaign list). Never an internal id, policy hash or agency — the
            server resolves those. Unknown, closed and wrong-agency codes are
            one NO_OPEN_CAMPAIGN.
          type: "string"
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,63}$"
        nesaIndexNumber:
          type: "string"
          maxLength: 64
        hecRegistrationNumber:
          type: "string"
          maxLength: 64

    ExamInvitationView:
      description: >-
        ADR-033. The invitation travels ONLY in the READY state. qrPayload is the
        signed slot invitation (USRP-SLOT.v1…), PII-free by construction
        (ADR-009), verified offline at the venue.
      type: "object"
      additionalProperties: false
      required: ["state", "agency", "processingCode", "campaignLabel", "currentStatus"]
      properties:
        state:
          type: "string"
          enum: ["READY", "ADMITTED", "PENDING", "ON_HOLD", "COMPLETED", "CLOSED", "EXPIRED", "UNAVAILABLE", "WALK_IN"]
        agency:
          $ref: "#/components/schemas/Agency"
        processingCode:
          type: "string"
        campaignLabel:
          type: ["string", "null"]
        currentStatus:
          type: "string"
        invitation:
          $ref: "#/components/schemas/ExamInvitationPayload"
        admission:
          $ref: "#/components/schemas/ExamInvitationAdmission"

    ExamInvitationAdmission:
      description: "ADR-034. Present only in state ADMITTED: where and when the single-use QR was spent. The QR itself is never sent again."
      type: "object"
      additionalProperties: false
      required: ["venueName", "admittedAt"]
      properties:
        venueName:
          type: "string"
        admittedAt:
          type: "string"
          format: "date-time"

    ExamInvitationPayload:
      type: "object"
      additionalProperties: false
      required: ["qrPayload", "ticketId", "venueName", "examDate", "reportingTimeHour", "validUntil"]
      properties:
        qrPayload:
          type: "string"
          pattern: "^USRP-SLOT\\.v1\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"
          maxLength: 4096
        ticketId:
          type: "string"
        venueName:
          type: "string"
        examDate:
          type: "string"
        reportingTimeHour:
          type: "integer"
          minimum: 0
          maximum: 23
        validUntil:
          type: "string"

    DocumentChecklistItem:
      type: "object"
      additionalProperties: false
      required: ["documentType", "satisfaction", "registry"]
      properties:
        documentType:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        satisfaction:
          type: "string"
          enum: ["API_VERIFIED", "UPLOADED_CLEARED", "VENUE_VERIFIED", "AWAITING_REGISTRY", "UNDER_REVIEW", "REJECTED", "MISSING"]
        registry:
          description: "NIDA | NESA | HEC | RIB when a registry can verify the item; null when it can only be uploaded or presented."
          type: ["string", "null"]

    DocumentChecklist200:
      description: >-
        ADVISORY (ADR-032): never a gate. Types, states and the verifying
        registry only — no forensic score, flag, object key or officer id.
      type: "object"
      additionalProperties: false
      required: ["agency", "source", "complete", "items"]
      properties:
        agency:
          $ref: "#/components/schemas/Agency"
        source:
          type: "string"
          enum: ["POLICY_VERSION", "GROUND_TRUTH_TABLE"]
        complete:
          type: "boolean"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/DocumentChecklistItem"

    UploadDocumentForm:
      type: "object"
      required: ["applicationId", "documentType", "file"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        documentType:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
        file:
          type: "string"
          format: "binary"

    DocumentUploaded201:
      type: "object"
      additionalProperties: false
      required: ["status", "documentId", "documentType"]
      properties:
        status:
          type: "string"
          const: "UPLOADED"
        documentId:
          type: "string"
          format: "uuid"
        documentType:
          type: "string"

    SubmitApplicationResponse:
      type: "object"
      additionalProperties: false
      required: ["status", "applicationId", "processingCode", "agency"]
      properties:
        status:
          type: "string"
          const: "SUBMITTED"
        applicationId:
          type: "string"
          format: "uuid"
        processingCode:
          type: "string"
        agency:
          $ref: "#/components/schemas/Agency"

    VerifyIdentity400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["MISSING_NATIONAL_ID", "INVALID_CHANNEL", "INVALID_NATIONAL_ID"]
        detail:
          type: "string"

    ApplicantAuth400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["INVALID_REQUEST", "INVALID_CHANNEL", "INVALID_NATIONAL_ID", "INVALID_PHONE_NUMBER", "INVALID_CAMPAIGN_CODE"]
        detail:
          type: "string"

    InvalidApplicantId400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_APPLICANT_ID"
        detail:
          type: "string"

    Unauthenticated401:
      description: "The JWT kinds. Citizen sessions fail INVALID_SESSION instead."
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "UNAUTHENTICATED"
        detail:
          type: "string"

    InvalidSession401:
      description: >-
        THE CITIZEN'S 401. Distinct code from the JWT kinds' UNAUTHENTICATED,
        same status, same service. Absent, malformed, expired and revoked are
        all this one shape.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_SESSION"
        detail:
          type: "string"

    InvalidOtp401:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_OTP"
        detail:
          type: "string"

    Forbidden403:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "FORBIDDEN"
        detail:
          type: "string"

    NidaUnavailable503:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "NIDA_UNAVAILABLE"

    UpstreamUnavailable502:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "UPSTREAM_UNAVAILABLE"

    IdentityError500:
      description: "Detail is written in source and discarded on the wire."
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["IDENTITY_PERSISTENCE_ERROR", "INTERNAL_ERROR"]

    ApplicantAuthError500:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["PERSISTENCE_ERROR", "INTERNAL_ERROR"]
