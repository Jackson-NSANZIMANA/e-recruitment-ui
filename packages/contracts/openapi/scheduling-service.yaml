# ════════════════════════════════════════════════════════════════
# scheduling-service — an EVENT-DRIVEN stage gate with one read route and one
# officer command.
#
# HAND-AUTHORED from src/main.ts and src/adapters/campaign-session.controller.ts.
# This service has NO adapters/http directory: the key read is declared inline
# in the composition root and the session command's controller sits directly
# under src/adapters/, which is why every survey that walked
# services/*/src/adapters/http/** missed both.
# ════════════════════════════════════════════════════════════════
openapi: "3.1.0"

info:
  title: "USRP scheduling-service"
  version: "1.0.0"
  description: >-
    Consumes APPLICATION_ELIGIBILITY_CLEARED, resolves the applicant's home
    district to an exam venue, and emits SLOT_ASSIGNED + AUDIT_ENTRY. It never
    writes application state; application-service's projection applies the
    SLOT_ASSIGNED it emits (ADR-006).


    The citizen sees their slot through identity-service's
    getMyExamInvitation (ADR-033), which returns the signed QR, venue, date and
    reporting hour once SLOT_ASSIGNED has been projected. This service owns the
    per-district exam sessions an agency admin configures before a campaign is
    published (configureCampaignSession).
  x-usrp-backend-sha: "df80f6517247a00ffd99518fd31bd7c68dd70d65"
  x-usrp-service-port-var: "PORT_SCHEDULING_SERVICE"
  x-usrp-transport-faults:
    - status: 405
      code: "METHOD_NOT_ALLOWED"
      note: "Route table is keyed (path -> method). Carries an Allow header."
    - status: 413
      code: "PAYLOAD_TOO_LARGE"
      note: "Body-parsing operations only (configureCampaignSession)."
    - status: 415
      code: "UNSUPPORTED_MEDIA_TYPE"
      note: "Body-parsing operations only (configureCampaignSession)."
    - status: 400
      code: "MALFORMED_JSON"
      note: "Body-parsing operations only. Also EMPTY_BODY."

paths:
  /v1/campaigns/session:
    post:
      operationId: "configureCampaignSession"
      summary: "Configure one district's exam session for a draft campaign (officer, BUILD-001)"
      description: >-
        OFFICER-ONLY. The agency and actor come from the verified bearer token.
        A UUID Idempotency-Key header is REQUIRED; a replay of the same key and
        body returns the stored original response with Idempotency-Replayed:
        true, and the edge never retries this write on its own.


        One session per target district, editable only while the campaign is
        DRAFT and before any seat is reserved. A null capacityLimit is legal
        ONLY with capacityDecisionCode UNBOUNDED_CAPACITY, an explicit audited
        decision. Every response returns the new coverage version and digest
        that publishCampaign later freezes.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/campaign-session.controller.ts (CONFIGURE_CAMPAIGN_SESSION_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignSessionRequest"
      responses:
        "200":
          description: "SESSION_CONFIGURED, SESSION_UNCHANGED, or the replay of the original response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSessionConfigured200"
        "400":
          description: "INVALID_IDEMPOTENCY_KEY, INVALID_REQUEST, INVALID_PUBLIC_CODE, INVALID_DATE, INVALID_DISTRICT, INVALID_PROVINCE, CAPACITY_DECISION_REQUIRED or INVALID_CAPACITY_DECISION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandRejection"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "FORBIDDEN: not an officer, missing campaign.session.configure, or the database refused the agency-admin role."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandRejection"
        "404":
          description: "CAMPAIGN_NOT_FOUND in the officer's own agency."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandRejection"
        "409":
          description: "INVALID_STATE (not a draft), SESSION_ALREADY_RESERVED, STALE_COVERAGE, SESSION_CONFLICT or CAPACITY_DECISION_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandRejection"
        "422":
          description: "DISTRICT_PROVINCE_MISMATCH, DISTRICT_NOT_TARGETED, INVALID_SESSION_DATE or INVALID_SESSION_CONFIGURATION."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCommandRejection"
        "500":
          description: "CAMPAIGN_SESSION_PERSISTENCE_ERROR or INTERNAL_ERROR. Detail withheld."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionError500"

  /v1/slots/invitation-key:
    get:
      operationId: "getSlotInvitationKey"
      summary: "The Ed25519 public key that verifies a slot-invitation QR"
      description: >-
        UNAUTHENTICATED — and correctly so. The handler is declared inline in
        main.ts with no withAuth wrapper, so there is no 401 and no 403 branch
        on this route. It publishes a PUBLIC key so a venue, biometric or
        physical-test station can verify a signed QR invitation OFFLINE
        (ADR-009). No PII, no state.


        This is a distinct key from the officer/system token issuer key.
        Verifying a bearer token with it will fail; it verifies QR invitation
        signatures only.


        Note what this key CANNOT do for the frontend: the QR payload it
        verifies is a bearer credential the field officer scans at the venue,
        and the officer detail read deliberately withholds
        qr_invitation_code. Holding the verification key does not give the
        browser anything to verify.
      x-usrp-auth: ["none"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/main.ts (inline route, startHttpServer routes[0])"
      x-usrp-verified: "controller-verbatim"
      responses:
        "200":
          description: "The active QR-signing public key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationKeyOk"

  /health:
    get:
      operationId: "schedulingHealth"
      summary: "Liveness"
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "@usrp/shared-http (reserved probe)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Process is up."

  /ready:
    get:
      operationId: "schedulingReady"
      summary: "Readiness — database reachable"
      description: >-
        READ WHAT THIS DOES NOT COVER. The readiness callback runs SELECT 1
        only. This service's actual job is consuming application.cleared from
        Kafka, and with KAFKA_BROKERS unset it starts no consumer at all yet
        still answers 200 here. A green /ready on this service does not mean
        applications are being scheduled.
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/main.ts (readiness callback)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Database reachable. Says nothing about the event consumer."
        "503":
          description: "Database unreachable."

components:
  schemas:
    CampaignSessionRequest:
      description: >-
        normalizeCampaignSession: exact keys. The province must own the
        district. publicCode is trimmed and upper-cased before validation.
      type: "object"
      additionalProperties: false
      required:
        - "publicCode"
        - "district"
        - "province"
        - "venueName"
        - "examDate"
        - "reportingTimeHour"
        - "capacityLimit"
        - "isActive"
      properties:
        publicCode:
          type: "string"
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,63}$"
        district:
          type: "string"
          minLength: 1
        province:
          type: "string"
          minLength: 1
        venueName:
          type: "string"
          minLength: 1
          maxLength: 200
        examDate:
          type: "string"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        reportingTimeHour:
          type: "integer"
          minimum: 0
          maximum: 23
        capacityLimit:
          type: ["integer", "null"]
          minimum: 1
        capacityDecisionCode:
          oneOf:
            - type: "string"
              const: "UNBOUNDED_CAPACITY"
            - type: "null"
        isActive:
          type: "boolean"

    CampaignSessionConfigured200:
      type: "object"
      additionalProperties: false
      required: ["status", "publicCode", "district", "coverageVersion", "coverageHash", "capacityDecisionCode"]
      properties:
        status:
          type: "string"
          enum: ["SESSION_CONFIGURED", "SESSION_UNCHANGED"]
        publicCode:
          type: "string"
          pattern: "^[A-Z0-9][A-Z0-9-]{2,63}$"
        district:
          type: "string"
        coverageVersion:
          type: "integer"
        coverageHash:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
        capacityDecisionCode:
          oneOf:
            - type: "string"
              const: "UNBOUNDED_CAPACITY"
            - type: "null"

    SessionCommandRejection:
      description: >-
        HttpError body for a 4xx session command. The code set is OPEN (the
        write function raises P0001 with a leading code token); show `detail`,
        always present below 500, for codes the UI does not branch on.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          pattern: "^[A-Z][A-Z0-9_]+$"
        detail:
          type: "string"

    SessionError500:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["CAMPAIGN_SESSION_PERSISTENCE_ERROR", "INTERNAL_ERROR"]

    Unauthenticated401:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "UNAUTHENTICATED"
        detail:
          type: "string"

    InvitationKeyOk:
      type: "object"
      additionalProperties: false
      required: ["keyId", "algorithm", "publicKeyPem"]
      properties:
        keyId:
          description: "QR_SIGNING_KEY_ID. Identifies which key signed a given QR."
          type: "string"
        algorithm:
          type: "string"
          const: "Ed25519"
        publicKeyPem:
          description: "PEM-encoded SPKI public key. Public by design."
          type: "string"
