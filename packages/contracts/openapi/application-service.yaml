# ════════════════════════════════════════════════════════════════
# application-service — the state owner and the officer front door.
#
# HAND-AUTHORED from all five controllers and src/main.ts at backend SHA
# 47d9ad3. Every operation in this document is x-usrp-verified:
# controller-verbatim — the request and response shapes were transcribed from
# the named controller file, field by field. Nothing here is derived from a
# commit message or a selfcheck summary.
#
# Thirteen business operations across twelve paths (GET and POST share
# /v1/applications), plus two probes.
# ════════════════════════════════════════════════════════════════
openapi: "3.1.0"

info:
  title: "USRP application-service"
  version: "1.0.0"
  description: >-
    The single writer of application state (ADR-006) and the officer read
    surface. Agency isolation is enforced by Postgres RLS under the officer's
    own agency DB role — never by this document, never by the UI.


    THERE IS NO GENERIC STATUS TRANSITION. The deprecated frontend modelled one
    PATCH /applications/:id/status with a { toStatus, note } body. No such
    endpoint exists or could exist: the four officer writes each have their own
    guard, their own body, their own outcome union, and none of them returns an
    application object. They return the transition that was applied.


    NOTHING PAGINATES. The list read caps at 100 with no filter, no cursor and
    no total.
  x-usrp-backend-sha: "47d9ad3ab019f6d2f826cfae2136cbff898d733f"
  x-usrp-service-port-var: "PORT_APPLICATION_SERVICE"
  x-usrp-transport-faults:
    - status: 405
      code: "METHOD_NOT_ALLOWED"
      note: "Route table is keyed (path -> method). Carries an Allow header."
    - status: 413
      code: "PAYLOAD_TOO_LARGE"
      note: "Body-parsing operations only."
    - status: 415
      code: "UNSUPPORTED_MEDIA_TYPE"
      note: "Body-parsing operations only."
    - status: 400
      code: "MALFORMED_JSON"
      note: "Body-parsing operations only. Also EMPTY_BODY."

paths:
  # ───────────────────────────────────────────────────────────────
  # Officer reads
  # ───────────────────────────────────────────────────────────────

  /v1/applications:
    get:
      operationId: "listApplications"
      summary: "List the calling officer's own agency applications"
      description: >-
        Runs under the officer's own agency DB role, so rls/0001 per-agency
        isolation enforces on a live request. TAKES NO PARAMETERS: no status
        filter, no search, no pagination. Capped at DEFAULT_MAX_RESULTS (100)
        and returned as an array with no total. Past roughly 100 rows an officer
        cannot locate a specific application, which is why a search endpoint is
        a documented gap.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/list-applications.controller.ts (listApplicationsRoute)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "200":
          description: "The agency's applications, non-PII."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListApplicationsOk"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: >-
            Two shapes on one status: { error, detail } from withAuth for a
            non-officer principal, { error } alone from the FORBIDDEN outcome
            branch. Same code, different bodies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "500":
          description: "APPLICATION_READ_ERROR or INTERNAL_ERROR. Detail withheld by design."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"
    post:
      operationId: "submitApplication"
      summary: "File an application"
      description: >-
        SERVICE-INTERNAL. Requires a system bearer token; the caller is the edge
        tier acting for an authenticated citizen. Shares the path with the
        officer GET — shared-http keys its table by (path -> method), so the two
        coexist.


        THE ACADEMIC FIELDS ARE OPTIONAL ON THE WIRE AND CONDITIONALLY REQUIRED
        BY DOMAIN. nesaIndexNumber and hecRegistrationNumber are both optional
        here; WHICH one is required is keyed off category, and getting it wrong
        is 422 INVALID_ACADEMIC_INPUT with a `reason`. A form that marks both
        optional will produce a 422 the applicant cannot interpret — branch the
        form on category.
      x-usrp-auth: ["system"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/adapters/http/submit-application.controller.ts (SUBMIT_APPLICATION_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationRequest"
      responses:
        "201":
          description: "Filed; APPLICANT_SUBMITTED published. Returns the processing code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmitted201"
        "400":
          description: >-
            MISSING_APPLICANT_ID, INVALID_APPLICANT_ID, INVALID_CATEGORY,
            INVALID_CHANNEL or INVALID_FIELD. Note the underscored spelling —
            the walk-in controller spells the same concept differently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not a system principal — an officer token lands here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "APPLICANT_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantNotFound404"
        "409":
          description: >-
            IDENTITY_NOT_VERIFIED (verify first) or NO_OPEN_CAMPAIGN (with
            agency — nothing is recruiting). Different remedies, discriminated
            on `status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitConflict409"
        "422":
          description: "INVALID_ACADEMIC_INPUT with a `reason` naming the mismatch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAcademicInput422"
        "500":
          description: >-
            APPLICATION_READ_ERROR, APPLICATION_PERSISTENCE_ERROR or
            INTERNAL_ERROR.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/amber-queue:
    get:
      operationId: "listAmberQueue"
      summary: "The officer review queue (ADR-011)"
      description: >-
        Applications held at DOCUMENT_REVIEW_AMBER joined to their un-reviewed
        amber document rows, PLUS applications held at ADJUDICATION_REVIEW — for
        which every document field is null. A UI that assumes documentType is
        present will render blanks for every adjudication hold. Non-PII by
        construction: the processing code stands in for the applicant.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/list-applications.controller.ts (amberQueueRoute)"
      x-usrp-verified: "controller-verbatim"
      responses:
        "200":
          description: "The agency's review queue."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmberQueueOk"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "500":
          description: "Read fault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/by-applicant:
    get:
      operationId: "listApplicationsByApplicant"
      summary: "One citizen's applications, across all three agencies"
      description: >-
        SERVICE-INTERNAL (ADR-018). The caller is identity-service, which has
        already validated the citizen's opaque session and asks on their behalf
        with its own client-credentials token. AN OFFICER TOKEN IS REFUSED WITH
        403: the citizen door must never widen an officer's agency-scoped view.
        Cross-agency by design — a union across the three ops schemas — which is
        precisely why the citizen edge cannot be per-agency.
      x-usrp-auth: ["system"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/adapters/http/list-applications.controller.ts (byApplicantRoute)"
      x-usrp-verified: "controller-verbatim"
      parameters:
        - name: "applicantId"
          in: "query"
          required: true
          description: "Opaque applicant UUID. Never a national ID or its hash."
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: "The citizen's applications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByApplicantOk"
        "400":
          description: "applicantId is absent or not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApplicantId400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not a system principal — an officer token lands here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "500":
          description: "Read fault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/by-id:
    get:
      operationId: "findApplicationById"
      summary: "One application from the calling officer's own agency"
      description: >-
        The officer console detail screen's only data source. Nothing in the
        platform returned a single application before this route existed.


        THE 404 IS DELIBERATELY BARE. A sibling agency's real application id and
        a wholly nonexistent one produce byte-identical responses, because the
        query only touches the caller's own schema and the two cases are
        therefore indistinguishable. Without that property an officer could walk
        ids to learn what another agency is processing, and nothing in the
        request log would look wrong. DO NOT ADD DETAIL TO THIS RESPONSE, and do
        not write UI copy that implies the record might exist elsewhere.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/list-applications.controller.ts (byIdRoute)"
      x-usrp-verified: "controller-verbatim"
      parameters:
        - name: "applicationId"
          in: "query"
          required: true
          description: >-
            A QUERY PARAM, not a path param. shared-http matches paths exactly
            and has no param syntax (ADR-005). /v1/applications/${id} cannot
            route at all.
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: "The application detail, non-PII."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindApplicationOk"
        "400":
          description: "applicationId is absent or not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApplicationId400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: >-
            No such application in the caller's own agency schema. Also the
            answer for another agency's real application. Bare by design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound404"
        "500":
          description: "Read fault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/status-history:
    get:
      operationId: "getApplicationStatusHistory"
      summary: "The immutable transition trail for one application"
      description: >-
        The append-only status trail (rls/0007 — enforced by trigger AND by
        revoked UPDATE/DELETE grant), oldest first, carrying actor, actor kind,
        timestamp and note per entry.


        THIS ROUTE IS THE PROCEDURAL JUSTICE SURFACE. Without it, "the applicant
        can see who decided what, when, and on what ground" is unimplementable
        no matter how good the UI is.


        NOTE THE AUDIENCE MISMATCH: it is OFFICER-authenticated. The citizen —
        the person with the interest in the trail — cannot reach it. Serving it
        to an applicant needs either an edge-tier proxy under their session or a
        session-authenticated sibling route, and neither exists today.


        A missing application returns 404, never an empty history array. The
        distinction matters: a blank timeline for a record that exists reads to a
        reviewer as "nothing happened", which is a different and false claim.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/list-applications.controller.ts (statusHistoryRoute)"
      x-usrp-verified: "controller-verbatim"
      parameters:
        - name: "applicationId"
          in: "query"
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: "The transition trail, oldest first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusHistoryOk"
        "400":
          description: "applicationId is absent or not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidApplicationId400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Same bare 404 as by-id, for the same reason."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFound404"
        "500":
          description: "Read fault."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  # ───────────────────────────────────────────────────────────────
  # Officer writes — FOUR named operations, not one generic transition.
  #
  # THE CONTROLLER'S OWN HEADER COMMENT SAYS "Three OFFICER-authenticated write
  # endpoints" AND LISTS THREE. The file exports four and the factory returns
  # four. Stale documentation on the most safety-critical controller in the
  # platform, recorded here because this document is now the place that gets it
  # right.
  #
  # ALL FOUR SHARE ONE mapOutcome, WHICH ERASES PER-COMMAND NARROWING. At the
  # type level every one of them can emit 422 INVALID_MEDICAL_INPUT and 409
  # CROSS_AGENCY_LOCKED. In behaviour only medical-review emits the first and
  # only accept emits the second. This document records the REAL narrowing per
  # operation and notes where the HTTP layer is strictly looser than the
  # behaviour it implements — a client built on the loose union will carry dead
  # branches for outcomes its route cannot produce.
  # ───────────────────────────────────────────────────────────────

  /v1/applications/medical-review:
    post:
      operationId: "recordMedicalReview"
      summary: "Record the medical fitness outcome"
      description: >-
        applicationId travels in the BODY, not the path.


        TWO AGENCY MODES, AND THE BODY DIFFERS (ADR-013). RDF is a BOARD agency
        and sends fitnessStatus: FIT | UNFIT. RNP and RCS are CERTIFICATE
        agencies and send certVerdict: CERT_VERIFIED | CERT_REJECTED, plus
        physicianName when verified. Sending neither is 400
        MISSING_MEDICAL_VERDICT; sending the WRONG ONE FOR YOUR AGENCY is 422
        INVALID_MEDICAL_INPUT with a `reason` naming the mode. The form must
        branch on the officer's agency, and the officer's agency is not in the
        login response — see the iam-service gap.


        The only one of the four transitions that can actually emit 422.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/officer-transitions.controller.ts (MEDICAL_REVIEW_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalReviewRequest"
      responses:
        "200":
          description: "APPLIED (with fromStatus/toStatus) or NO_CHANGE (with currentStatus)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionOk200"
        "400":
          description: >-
            MISSING_APPLICATION_ID, INVALID_APPLICATION_ID,
            INVALID_FITNESS_STATUS, INVALID_CERT_VERDICT,
            INVALID_PHYSICIAN_NAME or MISSING_MEDICAL_VERDICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalReviewRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Not in the caller's agency, or nonexistent. Bare."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: "NOT_APPLICABLE with currentStatus — not in a reviewable state."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotApplicable409"
        "422":
          description: "INVALID_MEDICAL_INPUT with `reason`. ONLY this route emits it."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidMedicalInput422"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/final-decision:
    post:
      operationId: "recordFinalDecision"
      summary: "Record the final shortlist decision"
      description: >-
        decision is SHORTLIST | REJECT. notes is OPTIONAL (max 1000, matching
        final_decision_notes varchar(1000)) — and note the asymmetry with
        adjudicate, which also accepts optional notes, versus the erasure
        decline on identity-service, where the note is MANDATORY. A rejection
        here can be recorded with no stated ground; the history entry truncates
        to 200 chars.


        NARROWING: at the type level this route shares mapOutcome and so appears
        able to emit 422 INVALID_MEDICAL_INPUT and 409 CROSS_AGENCY_LOCKED. It
        cannot. Those two are absent below on purpose.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/officer-transitions.controller.ts (FINAL_DECISION_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalDecisionRequest"
      responses:
        "200":
          description: "APPLIED or NO_CHANGE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionOk200"
        "400":
          description: "MISSING_APPLICATION_ID, INVALID_APPLICATION_ID, INVALID_DECISION or INVALID_NOTES."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Not in the caller's agency, or nonexistent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: "NOT_APPLICABLE with currentStatus."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotApplicable409"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/accept:
    post:
      operationId: "acceptApplication"
      summary: "Accept an applicant and stamp the cross-agency accept-lock"
      description: >-
        MISSING FROM THE SYSTEM BRIEF'S ROUTE LIST, and the most consequential
        omission in it. This is the route that stamps the ADR-014 cross-agency
        accept-lock and the ONLY source of 409 CROSS_AGENCY_LOCKED.


        ACCEPTING HERE ALSO AUTO-WITHDRAWS THE CITIZEN'S OTHER IN-FLIGHT
        APPLICATIONS (ADR-017), asynchronously, off application.accepted. One
        accept ends every other application that person has at every other
        agency. The confirmation UI must say so; a bare "Accept?" dialog hides
        an irreversible cross-agency consequence from the officer taking
        responsibility for it.


        The body is applicationId ALONE — no decision, no notes.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/officer-transitions.controller.ts (ACCEPT_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRequest"
      responses:
        "200":
          description: "APPLIED or NO_CHANGE. Siblings auto-withdraw asynchronously."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionOk200"
        "400":
          description: "MISSING_APPLICATION_ID or INVALID_APPLICATION_ID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Not in the caller's agency, or nonexistent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: >-
            NOT_APPLICABLE (with currentStatus) or CROSS_AGENCY_LOCKED (with
            lockedByAgency) when another agency already holds the accept-lock on
            this citizen. ONLY THIS ROUTE emits the latter, and lockedByAgency
            may be the officer's OWN agency via a second application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptConflict409"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/adjudicate:
    post:
      operationId: "adjudicateApplication"
      summary: "Resolve an ADJUDICATION_REVIEW or amber document hold"
      description: >-
        The only exit from ADJUDICATION_REVIEW (ADR-011). A late disqualifying
        verdict holds here for a human rather than auto-rejecting, so this is
        where an accountable officer decides. decision is CLEAR | REJECT.


        The APPLIED branch is mapped down from a richer internal outcome that
        carries event-emit identifiers — the client deliberately never sees
        them.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/officer-transitions.controller.ts (ADJUDICATE_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjudicateRequest"
      responses:
        "200":
          description: "APPLIED or NO_CHANGE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionOk200"
        "400":
          description: "MISSING_APPLICATION_ID, INVALID_APPLICATION_ID, INVALID_DECISION or INVALID_NOTES."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Not in the caller's agency, or nonexistent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: "NOT_APPLICABLE — not on an adjudication hold."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotApplicable409"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  # ───────────────────────────────────────────────────────────────
  # Walk-in lane — RDF ONLY (ADR-012), two steps
  # ───────────────────────────────────────────────────────────────

  /v1/applications/walk-in/register:
    post:
      operationId: "registerWalkIn"
      summary: "Register an exam-day walk-in applicant"
      description: >-
        RDF ONLY. An RNP or RCS officer receives 501 UNSUPPORTED_AGENCY, so the
        UI must branch on agency rather than offering a door that cannot open.


        THE BODY IS { applicantId, category, nesaIndexNumber?,
        hecRegistrationNumber? }. The deprecated frontend sent
        { nationalIdHash, postCode }: nationalIdHash is an internal
        cross-service key the browser must never see or compute, and postCode is
        not a concept anywhere in this system.


        THE 201 RETURNS qrInvitationCode — A BEARER CREDENTIAL. This is the ONLY
        response in the platform that hands one out, and it does so because the
        field officer must print or show it at the venue. The officer detail read
        deliberately withholds it. Do not log it, do not put it in a URL, and do
        not persist it in browser storage.


        CODE-SPELLING DEFECT, RECORDED VERBATIM: this controller builds 400 codes
        by upper-casing the field name, yielding MISSING_APPLICANTID and
        INVALID_APPLICATIONID where every other controller in the platform emits
        MISSING_APPLICANT_ID. Two spellings of one code on one service. A client
        switching on the code needs both.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/walk-in.controller.ts (WALK_IN_REGISTER_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInRegisterRequest"
      responses:
        "201":
          description: "Registered. Carries the minted on-site QR invitation code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInRegistered201"
        "400":
          description: >-
            THE UN-UNDERSCORED SPELLINGS: MISSING_APPLICANTID,
            INVALID_APPLICANTID, INVALID_NESAINDEXNUMBER,
            INVALID_HECREGISTRATIONNUMBER — plus INVALID_CATEGORY, which is
            spelled normally because it is not built from a field name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInRegisterRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "APPLICANT_NOT_FOUND — verify the identity first."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantNotFound404"
        "409":
          description: >-
            IDENTITY_NOT_VERIFIED or NO_WALK_IN_CAMPAIGN (with agency).
            Discriminated on `status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInRegisterConflict409"
        "422":
          description: >-
            WRONG_AGENCY_CATEGORY (with categoryAgency — the category belongs to
            a different agency) or INVALID_ACADEMIC_INPUT (with reason).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInRegisterUnprocessable422"
        "501":
          description: >-
            UNSUPPORTED_AGENCY with agency — the caller is RNP or RCS. An honest
            501 rather than a raw DB enum error, because rdf_ops is the only
            schema that models the WALK_IN_* statuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedAgency501"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR, APPLICATION_READ_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  /v1/applications/walk-in/vet:
    post:
      operationId: "vetWalkIn"
      summary: "Record the on-site eligibility check for a walk-in"
      description: >-
        Step two. Body is { applicationId }.


        409 AGE_PENDING IS RETRYABLE AND THE ONLY RETRYABLE 409 IN THE PLATFORM.
        The autonomous age verdict rides the backbone off the register step's
        APPLICANT_SUBMITTED and may not have landed yet, so the tablet retries
        shortly. Rendering it beside NOT_APPLICABLE as one generic "conflict"
        strands a candidate standing at the desk.


        The APPLIED body carries an extra `ageStatus` field the other three
        transitions do not.
      x-usrp-auth: ["officer"]
      x-usrp-reach: "browser"
      x-usrp-source: "src/adapters/http/walk-in.controller.ts (WALK_IN_VET_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInVetRequest"
      responses:
        "200":
          description: "APPLIED (with ageStatus) or NO_CHANGE."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInVetOk200"
        "400":
          description: "MISSING_APPLICATIONID or INVALID_APPLICATIONID — the un-underscored spelling."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInVetRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not an officer principal, or the FORBIDDEN outcome branch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "Not in the caller's agency, or nonexistent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: >-
            AGE_PENDING (RETRYABLE — retry in a moment) or NOT_APPLICABLE (not
            retryable). Both carry currentStatus. Discriminated on `status`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalkInVetConflict409"
        "501":
          description: "UNSUPPORTED_AGENCY — the caller is RNP or RCS."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsupportedAgency501"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR, APPLICATION_READ_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  # ───────────────────────────────────────────────────────────────
  # Citizen self-service (ADR-020)
  # ───────────────────────────────────────────────────────────────

  /v1/applications/withdraw-own:
    post:
      operationId: "withdrawOwnApplication"
      summary: "The citizen's own voluntary withdrawal"
      description: >-
        SERVICE-INTERNAL. identity-service calls this with its
        client-credentials token, carrying the citizen's authority derived from
        their validated session — never a body claim about someone else. AN
        OFFICER TOKEN IS REFUSED WITH 403: an officer withdrawing on a citizen's
        behalf would be an unaudited impersonation path.


        THE BODY CARRIES BOTH applicantId AND applicationId, unlike the citizen
        route that fronts it. Ownership is the row lookup
        (WHERE id = X AND applicant_id = Y FOR UPDATE), so a mismatch on either
        column is the same 404 — the door is deliberately not an ownership
        oracle.


        SOURCE DEFECT, RECORDED: mapDomainError at line 87 THROWS from inside a
        function declared `: HttpError` and called as `throw
        mapDomainError(err)`. Behaviour is accidentally identical to every
        sibling; the declared contract is violated and the return path is dead
        code. No wire consequence today.
      x-usrp-auth: ["system"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/adapters/http/self-withdrawal.controller.ts (WITHDRAW_OWN_PATH)"
      x-usrp-verified: "controller-verbatim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawOwnRequest"
      responses:
        "200":
          description: >-
            WITHDRAWN (with agency + fromStatus) or NO_CHANGE (with agency —
            idempotent, no writes, no audit row).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawOwnOk200"
        "400":
          description: "INVALID_REQUEST — applicantId or applicationId is not a UUID."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest400"
        "401":
          description: "No or invalid bearer token."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unauthenticated401"
        "403":
          description: "Not a system principal — an officer token lands here."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forbidden403"
        "404":
          description: "NOT_FOUND — no such application for that applicant."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitionNotFound404"
        "409":
          description: >-
            NOT_APPLICABLE with agency + currentStatus — ACCEPTED, REJECTED or
            WALK_IN_REJECTED. Terminal states cannot be withdrawn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawOwnNotApplicable409"
        "500":
          description: "APPLICATION_PERSISTENCE_ERROR or INTERNAL_ERROR."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationError500"

  # ───────────────────────────────────────────────────────────────
  # Probes — matched BEFORE the route table, so a wrong method 404s, not 405s
  # ───────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: "applicationHealth"
      summary: "Liveness"
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "@usrp/shared-http (reserved probe)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Process is up."

  /ready:
    get:
      operationId: "applicationReady"
      summary: "Readiness — database reachable"
      description: >-
        Covers the system-of-record only. It does NOT cover the six Kafka
        consumers that advance every application through its lifecycle, so a
        green probe here is compatible with a front door accepting submissions
        that then never move.
      x-usrp-auth: ["none"]
      x-usrp-reach: "service-internal"
      x-usrp-source: "src/main.ts (readiness callback)"
      x-usrp-verified: "controller-verbatim"
      x-usrp-transport-faults: "none"
      responses:
        "200":
          description: "Database reachable."
        "503":
          description: "Database unreachable."

components:
  schemas:
    Uuid:
      type: "string"
      format: "uuid"
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

    Agency:
      type: "string"
      enum: ["RDF", "RNP", "RCS"]

    ApplicationChannel:
      type: "string"
      enum: ["WEB", "USSD", "IREMBO_KIOSK", "WALK_IN"]

    ApplicationCategory:
      description: >-
        Validated against ALL_CATEGORIES, the union across all three agencies.
        Each category maps to EXACTLY ONE agency (agencyForCategory), and
        sending one that maps elsewhere is 422 WRONG_AGENCY_CATEGORY on the
        walk-in road. Typed string because the partition is the divergence
        model's job, not OpenAPI's.
      type: "string"
      minLength: 1

    ApplicationStatus:
      description: >-
        All 19 states. Per-agency legality is NOT expressible here — rnp_ops and
        rcs_ops carry no WALK_IN_* values. Use StatusFor<Agency> from
        src/agency.ts to constrain by agency at compile time.
      type: "string"
      enum:
        - "DRAFT"
        - "SUBMITTED"
        - "ACADEMIC_VETTING"
        - "CRIMINAL_CLEARANCE"
        - "DOCUMENT_REVIEW_GREEN"
        - "DOCUMENT_REVIEW_AMBER"
        - "SLOT_ASSIGNED"
        - "PHYSICAL_TEST_SCHEDULED"
        - "PHYSICAL_TEST_COMPLETE"
        - "MEDICAL_REVIEW"
        - "FINAL_SHORTLIST"
        - "ACCEPTED"
        - "ADJUDICATION_REVIEW"
        - "REJECTED"
        - "WITHDRAWN"
        - "WALK_IN_REGISTERED"
        - "WALK_IN_ON_SITE_VETTING"
        - "WALK_IN_PHYSICAL_TEST"
        - "WALK_IN_REJECTED"

    # ── Request bodies ──

    SubmitApplicationRequest:
      type: "object"
      additionalProperties: false
      required: ["applicantId", "category", "channel"]
      properties:
        applicantId:
          $ref: "#/components/schemas/Uuid"
        category:
          $ref: "#/components/schemas/ApplicationCategory"
        channel:
          $ref: "#/components/schemas/ApplicationChannel"
        nesaIndexNumber:
          description: >-
            Optional on the wire, conditionally required by domain. A present
            value must be a string; null and absent are equivalent.
          type: ["string", "null"]
        hecRegistrationNumber:
          type: ["string", "null"]

    MedicalReviewRequest:
      description: >-
        THE TWO MODES ARE MUTUALLY EXCLUSIVE IN PRACTICE but the wire accepts
        either, and OpenAPI cannot express "whichever your agency uses" because
        the agency comes from the token. Sending neither is 400; sending the
        wrong one for your agency is 422.
      type: "object"
      additionalProperties: false
      required: ["applicationId"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        fitnessStatus:
          description: "BOARD mode (RDF)."
          type: "string"
          enum: ["FIT", "UNFIT"]
        certVerdict:
          description: "CERTIFICATE mode (RNP/RCS)."
          type: "string"
          enum: ["CERT_VERIFIED", "CERT_REJECTED"]
        physicianName:
          description: "Required by the domain when certVerdict is CERT_VERIFIED."
          type: "string"

    FinalDecisionRequest:
      type: "object"
      additionalProperties: false
      required: ["applicationId", "decision"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        decision:
          type: "string"
          enum: ["SHORTLIST", "REJECT"]
        notes:
          description: >-
            OPTIONAL, max 1000 (final_decision_notes varchar(1000)). The history
            entry truncates to 200. A rejection may be recorded with no ground.
          type: ["string", "null"]
          maxLength: 1000

    AcceptRequest:
      description: "applicationId ALONE. No decision, no notes."
      type: "object"
      additionalProperties: false
      required: ["applicationId"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"

    AdjudicateRequest:
      type: "object"
      additionalProperties: false
      required: ["applicationId", "decision"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        decision:
          type: "string"
          enum: ["CLEAR", "REJECT"]
        notes:
          type: ["string", "null"]
          maxLength: 1000

    WalkInRegisterRequest:
      description: >-
        NOT { nationalIdHash, postCode }. See the operation description — the
        deprecated frontend's shape asked the browser to compute an internal
        cross-service key.
      type: "object"
      additionalProperties: false
      required: ["applicantId", "category"]
      properties:
        applicantId:
          $ref: "#/components/schemas/Uuid"
        category:
          $ref: "#/components/schemas/ApplicationCategory"
        nesaIndexNumber:
          type: ["string", "null"]
        hecRegistrationNumber:
          type: ["string", "null"]

    WalkInVetRequest:
      type: "object"
      additionalProperties: false
      required: ["applicationId"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"

    WithdrawOwnRequest:
      description: "BOTH ids. Ownership is the row lookup; either mismatch is one 404."
      type: "object"
      additionalProperties: false
      required: ["applicantId", "applicationId"]
      properties:
        applicantId:
          $ref: "#/components/schemas/Uuid"
        applicationId:
          $ref: "#/components/schemas/Uuid"

    # ── Row shapes, from ports/application-read-repository.ts ──

    ApplicationSummary:
      description: >-
        A non-PII summary row. The anonymous processing code stands in for the
        applicant — there is no name, no NID and no phone on any officer read.
      type: "object"
      additionalProperties: false
      required: ["applicationId", "processingCode", "category", "status", "submittedAt"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          description: "e.g. RDF-90823. The applicant's public handle."
          type: "string"
        category:
          $ref: "#/components/schemas/ApplicationCategory"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submittedAt:
          type: ["string", "null"]
          format: "date-time"

    ApplicantApplicationSummary:
      description: "A summary plus the owning agency, for the cross-agency citizen read."
      type: "object"
      additionalProperties: false
      required:
        ["applicationId", "processingCode", "category", "status", "submittedAt", "agency"]
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          type: "string"
        category:
          $ref: "#/components/schemas/ApplicationCategory"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submittedAt:
          type: ["string", "null"]
          format: "date-time"
        agency:
          $ref: "#/components/schemas/Agency"

    AmberQueueEntry:
      description: >-
        One review-queue row: either an amber document hold (document fields
        populated) or an ADJUDICATION_REVIEW hold (document fields ALL null).
        Both arrive in the same array.
      type: "object"
      additionalProperties: false
      required:
        - "applicationId"
        - "processingCode"
        - "status"
        - "documentType"
        - "forensicsScore"
        - "forensicsFlags"
        - "queuedAt"
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          type: "string"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        documentType:
          description: "NULL for every ADJUDICATION_REVIEW hold."
          type: ["string", "null"]
        forensicsScore:
          type: ["number", "null"]
        forensicsFlags:
          description: "The stored ForensicsFlags jsonb, verbatim. Opaque by design."
          type: ["object", "null"]
          additionalProperties: true
        queuedAt:
          type: ["string", "null"]
          format: "date-time"

    ApplicationDetail:
      description: >-
        The full non-PII view of ONE application — what the officer console
        detail screen renders.


        TWO OMISSIONS ARE SECURITY DECISIONS, NOT OVERSIGHTS. applicant_id is
        absent: the processing code stands in for the applicant and nothing here
        reveals who. qr_invitation_code is absent even though the column exists:
        it is a BEARER CREDENTIAL the field officer scans at the venue, and
        returning it would publish an invitation token to every console session
        able to open the record.


        THE COLUMN SET IS THE INTERSECTION OF THE THREE OPS SCHEMAS.
        medical_reviewed_*, is_walk_in, document_review_notes and
        sms_notification_status exist in rdf_ops but NOT rcs_ops — selecting them
        would make this read throw for RCS officers and nobody else. Three
        columns are typed string rather than an enum because the per-agency enum
        VALUES diverge (rcs_ops adds FLAGGED_PROSECUTION to
        criminal_clearance_status).
      type: "object"
      additionalProperties: false
      required:
        - "applicationId"
        - "processingCode"
        - "category"
        - "status"
        - "nesaIndexNumber"
        - "nesaVerifiedAt"
        - "hecRegistrationNumber"
        - "hecVerifiedAt"
        - "declaredSpecialistField"
        - "academicStatus"
        - "academicEligibilityDetail"
        - "ageEligibilityStatus"
        - "ageVerifiedAt"
        - "ageEligibilityDetail"
        - "criminalClearanceStatus"
        - "criminalClearanceAt"
        - "documentLane"
        - "documentForensicsScore"
        - "documentForensicsFlags"
        - "documentReviewedById"
        - "documentReviewedAt"
        - "documentReviewDecision"
        - "assignedDistrict"
        - "assignedVenueName"
        - "physicalTestScheduledAt"
        - "physicalTestCompletedAt"
        - "qrInvitationIssuedAt"
        - "smsNotificationSentAt"
        - "finalDecisionById"
        - "finalDecisionAt"
        - "finalDecisionNotes"
        - "submittedAt"
        - "createdAt"
        - "updatedAt"
      properties:
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          type: "string"
        category:
          $ref: "#/components/schemas/ApplicationCategory"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        nesaIndexNumber:
          type: ["string", "null"]
        nesaVerifiedAt:
          type: ["string", "null"]
          format: "date-time"
        hecRegistrationNumber:
          type: ["string", "null"]
        hecVerifiedAt:
          type: ["string", "null"]
          format: "date-time"
        declaredSpecialistField:
          type: ["string", "null"]
        academicStatus:
          type: "string"
        academicEligibilityDetail:
          description: "{ eligible, reason, details } jsonb, verbatim."
          type: ["object", "null"]
          additionalProperties: true
        ageEligibilityStatus:
          type: "string"
        ageVerifiedAt:
          type: ["string", "null"]
          format: "date-time"
        ageEligibilityDetail:
          description: >-
            { eligible, ageAtEvaluation, appliedMaxAge, reason } — NEVER the date
            of birth. The age gate is DOB-free by construction (ADR-006).
          type: ["object", "null"]
          additionalProperties: true
        criminalClearanceStatus:
          type: "string"
        criminalClearanceAt:
          type: ["string", "null"]
          format: "date-time"
        documentLane:
          description: "GREEN | AMBER | RED. Officer-facing only."
          type: ["string", "null"]
        documentForensicsScore:
          type: ["number", "null"]
        documentForensicsFlags:
          type: ["object", "null"]
          additionalProperties: true
        documentReviewedById:
          type: ["string", "null"]
        documentReviewedAt:
          type: ["string", "null"]
          format: "date-time"
        documentReviewDecision:
          type: ["string", "null"]
        assignedDistrict:
          type: ["string", "null"]
        assignedVenueName:
          type: ["string", "null"]
        physicalTestScheduledAt:
          type: ["string", "null"]
          format: "date-time"
        physicalTestCompletedAt:
          type: ["string", "null"]
          format: "date-time"
        qrInvitationIssuedAt:
          description: "WHEN the invitation was issued. Never the code itself."
          type: ["string", "null"]
          format: "date-time"
        smsNotificationSentAt:
          type: ["string", "null"]
          format: "date-time"
        finalDecisionById:
          type: ["string", "null"]
        finalDecisionAt:
          type: ["string", "null"]
          format: "date-time"
        finalDecisionNotes:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
          format: "date-time"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"

    StatusHistoryEntry:
      description: >-
        One entry of the immutable trail. This is the record a rejected applicant
        is entitled to see reasons from, so every field answering "who changed
        what, when, and why" is carried. actorKind is DERIVED so the UI can
        distinguish a human step from an automated one without string-matching
        'SYSTEM' in three components.
      type: "object"
      additionalProperties: false
      required:
        ["entryId", "fromStatus", "toStatus", "note", "actor", "actorKind", "at", "correlationId"]
      properties:
        entryId:
          $ref: "#/components/schemas/Uuid"
        fromStatus:
          description: "null on the first entry — nothing preceded it."
          oneOf:
            - $ref: "#/components/schemas/ApplicationStatus"
            - type: "null"
        toStatus:
          $ref: "#/components/schemas/ApplicationStatus"
        note:
          description: "The stored reason. The ground for the decision. May be null."
          type: ["string", "null"]
        actor:
          description: "'SYSTEM' or the officer token's sub (a UUID)."
          type: "string"
        actorKind:
          type: "string"
          enum: ["SYSTEM", "OFFICER"]
        at:
          type: "string"
          format: "date-time"
        correlationId:
          description: "Ties the entry to the Kafka causal chain that produced it."
          type: ["string", "null"]

    # ── Success envelopes ──

    ListApplicationsOk:
      type: "object"
      additionalProperties: false
      required: ["agency", "applications"]
      properties:
        agency:
          $ref: "#/components/schemas/Agency"
        applications:
          description: "Capped at 100. No total, no cursor — nothing here paginates."
          type: "array"
          items:
            $ref: "#/components/schemas/ApplicationSummary"

    AmberQueueOk:
      type: "object"
      additionalProperties: false
      required: ["agency", "queue"]
      properties:
        agency:
          $ref: "#/components/schemas/Agency"
        queue:
          type: "array"
          items:
            $ref: "#/components/schemas/AmberQueueEntry"

    ByApplicantOk:
      description: "NOTE: no `agency` on the envelope — the rows are cross-agency."
      type: "object"
      additionalProperties: false
      required: ["applications"]
      properties:
        applications:
          type: "array"
          items:
            $ref: "#/components/schemas/ApplicantApplicationSummary"

    FindApplicationOk:
      type: "object"
      additionalProperties: false
      required: ["agency", "application"]
      properties:
        agency:
          $ref: "#/components/schemas/Agency"
        application:
          $ref: "#/components/schemas/ApplicationDetail"

    StatusHistoryOk:
      type: "object"
      additionalProperties: false
      required: ["agency", "applicationId", "history"]
      properties:
        agency:
          $ref: "#/components/schemas/Agency"
        applicationId:
          $ref: "#/components/schemas/Uuid"
        history:
          description: "Oldest first. Stably ordered by (performed_at, id)."
          type: "array"
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"

    ApplicationSubmitted201:
      type: "object"
      additionalProperties: false
      required: ["status", "applicationId", "processingCode", "agency"]
      properties:
        status:
          type: "string"
          const: "SUBMITTED"
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          description: >-
            THE ONLY HANDLE THE CITIZEN GETS. Show it, and make it copyable —
            there is no search-by-code endpoint for an officer to find them with
            either (a documented gap), so this string is the whole shared
            reference between citizen and institution.
          type: "string"
        agency:
          $ref: "#/components/schemas/Agency"

    TransitionApplied:
      description: >-
        The shared APPLIED body for medical-review, final-decision, accept and
        adjudicate. NOTE WHAT IT IS NOT: it is not an application object. There
        is no way to write and read back in one call — refetch by-id afterwards.
      type: "object"
      additionalProperties: false
      required: ["status", "fromStatus", "toStatus"]
      properties:
        status:
          type: "string"
          const: "APPLIED"
        fromStatus:
          $ref: "#/components/schemas/ApplicationStatus"
        toStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    TransitionNoChange:
      description: "Idempotent success. The demanded end-state already held."
      type: "object"
      additionalProperties: false
      required: ["status", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "NO_CHANGE"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    TransitionOk200:
      description: "Two bodies on one status code, discriminated on `status`."
      oneOf:
        - $ref: "#/components/schemas/TransitionApplied"
        - $ref: "#/components/schemas/TransitionNoChange"
      discriminator:
        propertyName: "status"

    WalkInVetApplied:
      description: "Carries an extra ageStatus the other three transitions do not."
      type: "object"
      additionalProperties: false
      required: ["status", "fromStatus", "toStatus", "ageStatus"]
      properties:
        status:
          type: "string"
          const: "APPLIED"
        fromStatus:
          $ref: "#/components/schemas/ApplicationStatus"
        toStatus:
          $ref: "#/components/schemas/ApplicationStatus"
        ageStatus:
          type: "string"

    WalkInVetOk200:
      oneOf:
        - $ref: "#/components/schemas/WalkInVetApplied"
        - $ref: "#/components/schemas/TransitionNoChange"
      discriminator:
        propertyName: "status"

    WalkInRegistered201:
      type: "object"
      additionalProperties: false
      required: ["status", "applicationId", "processingCode", "qrInvitationCode"]
      properties:
        status:
          type: "string"
          const: "REGISTERED"
        applicationId:
          $ref: "#/components/schemas/Uuid"
        processingCode:
          type: "string"
        qrInvitationCode:
          description: >-
            A BEARER CREDENTIAL. The only response in the platform that returns
            one. Do not log it, do not put it in a URL, do not persist it in
            browser storage.
          type: "string"

    WithdrawnOwn200:
      type: "object"
      additionalProperties: false
      required: ["status", "agency", "fromStatus"]
      properties:
        status:
          type: "string"
          const: "WITHDRAWN"
        agency:
          $ref: "#/components/schemas/Agency"
        fromStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    WithdrawOwnNoChange200:
      type: "object"
      additionalProperties: false
      required: ["status", "agency"]
      properties:
        status:
          type: "string"
          const: "NO_CHANGE"
        agency:
          $ref: "#/components/schemas/Agency"

    WithdrawOwnOk200:
      oneOf:
        - $ref: "#/components/schemas/WithdrawnOwn200"
        - $ref: "#/components/schemas/WithdrawOwnNoChange200"
      discriminator:
        propertyName: "status"

    # ── Business-outcome refusals (keyed on `status`) ──

    ApplicantNotFound404:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "APPLICANT_NOT_FOUND"

    TransitionNotFound404:
      description: "Bare. Identical for another agency's real application."
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "NOT_FOUND"

    NotFound404:
      description: >-
        THE READ ROUTES' 404, KEYED ON `error` — not `status` like the write
        routes' NOT_FOUND. Same word, different key, same service. A client
        cannot use one guard for both.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "NOT_FOUND"

    NotApplicable409:
      type: "object"
      additionalProperties: false
      required: ["status", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "NOT_APPLICABLE"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    AgePending409:
      description: "THE ONLY RETRYABLE 409 IN THE PLATFORM. Retry in a moment."
      type: "object"
      additionalProperties: false
      required: ["status", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "AGE_PENDING"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    WalkInVetConflict409:
      oneOf:
        - $ref: "#/components/schemas/AgePending409"
        - $ref: "#/components/schemas/NotApplicable409"
      discriminator:
        propertyName: "status"

    CrossAgencyLocked409:
      description: >-
        ADR-014: one citizen, one acceptance. lockedByAgency may be the
        officer's OWN agency, via a second application by the same person.
      type: "object"
      additionalProperties: false
      required: ["status", "lockedByAgency"]
      properties:
        status:
          type: "string"
          const: "CROSS_AGENCY_LOCKED"
        lockedByAgency:
          $ref: "#/components/schemas/Agency"

    AcceptConflict409:
      oneOf:
        - $ref: "#/components/schemas/NotApplicable409"
        - $ref: "#/components/schemas/CrossAgencyLocked409"
      discriminator:
        propertyName: "status"

    IdentityNotVerified409:
      type: "object"
      additionalProperties: false
      required: ["status"]
      properties:
        status:
          type: "string"
          const: "IDENTITY_NOT_VERIFIED"

    NoOpenCampaign409:
      type: "object"
      additionalProperties: false
      required: ["status", "agency"]
      properties:
        status:
          type: "string"
          const: "NO_OPEN_CAMPAIGN"
        agency:
          $ref: "#/components/schemas/Agency"

    SubmitConflict409:
      oneOf:
        - $ref: "#/components/schemas/IdentityNotVerified409"
        - $ref: "#/components/schemas/NoOpenCampaign409"
      discriminator:
        propertyName: "status"

    NoWalkInCampaign409:
      type: "object"
      additionalProperties: false
      required: ["status", "agency"]
      properties:
        status:
          type: "string"
          const: "NO_WALK_IN_CAMPAIGN"
        agency:
          $ref: "#/components/schemas/Agency"

    WalkInRegisterConflict409:
      oneOf:
        - $ref: "#/components/schemas/IdentityNotVerified409"
        - $ref: "#/components/schemas/NoWalkInCampaign409"
      discriminator:
        propertyName: "status"

    WithdrawOwnNotApplicable409:
      type: "object"
      additionalProperties: false
      required: ["status", "agency", "currentStatus"]
      properties:
        status:
          type: "string"
          const: "NOT_APPLICABLE"
        agency:
          $ref: "#/components/schemas/Agency"
        currentStatus:
          $ref: "#/components/schemas/ApplicationStatus"

    InvalidMedicalInput422:
      type: "object"
      additionalProperties: false
      required: ["status", "reason"]
      properties:
        status:
          type: "string"
          const: "INVALID_MEDICAL_INPUT"
        reason:
          description: "Names which mode the caller's agency actually uses. Show it."
          type: "string"

    InvalidAcademicInput422:
      type: "object"
      additionalProperties: false
      required: ["status", "reason"]
      properties:
        status:
          type: "string"
          const: "INVALID_ACADEMIC_INPUT"
        reason:
          type: "string"

    WrongAgencyCategory422:
      type: "object"
      additionalProperties: false
      required: ["status", "categoryAgency"]
      properties:
        status:
          type: "string"
          const: "WRONG_AGENCY_CATEGORY"
        categoryAgency:
          description: "The agency the submitted category actually belongs to."
          $ref: "#/components/schemas/Agency"

    WalkInRegisterUnprocessable422:
      oneOf:
        - $ref: "#/components/schemas/WrongAgencyCategory422"
        - $ref: "#/components/schemas/InvalidAcademicInput422"
      discriminator:
        propertyName: "status"

    UnsupportedAgency501:
      description: >-
        RDF-only lane. An honest 501 rather than a raw DB enum error, because
        rdf_ops is the only schema modelling WALK_IN_*.
      type: "object"
      additionalProperties: false
      required: ["status", "agency"]
      properties:
        status:
          type: "string"
          const: "UNSUPPORTED_AGENCY"
        agency:
          $ref: "#/components/schemas/Agency"

    # ── Transport / shape refusals (keyed on `error`) ──

    InvalidApplicationId400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_APPLICATION_ID"
        detail:
          type: "string"

    InvalidApplicantId400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_APPLICANT_ID"
        detail:
          type: "string"

    InvalidRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "INVALID_REQUEST"
        detail:
          type: "string"

    SubmitRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum:
            - "MISSING_APPLICANT_ID"
            - "INVALID_APPLICANT_ID"
            - "INVALID_CATEGORY"
            - "INVALID_CHANNEL"
            - "INVALID_FIELD"
        detail:
          type: "string"

    TransitionRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum:
            - "MISSING_APPLICATION_ID"
            - "INVALID_APPLICATION_ID"
            - "INVALID_DECISION"
            - "INVALID_NOTES"
        detail:
          type: "string"

    MedicalReviewRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum:
            - "MISSING_APPLICATION_ID"
            - "INVALID_APPLICATION_ID"
            - "INVALID_FITNESS_STATUS"
            - "INVALID_CERT_VERDICT"
            - "INVALID_PHYSICIAN_NAME"
            - "MISSING_MEDICAL_VERDICT"
        detail:
          type: "string"

    WalkInRegisterRequest400:
      description: >-
        THE UN-UNDERSCORED SPELLINGS ARE NOT A TYPO IN THIS DOCUMENT. The
        controller builds these codes with `MISSING_${field.toUpperCase()}`,
        so applicantId becomes APPLICANTID. Recorded verbatim.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum:
            - "MISSING_APPLICANTID"
            - "INVALID_APPLICANTID"
            - "INVALID_CATEGORY"
            - "INVALID_NESAINDEXNUMBER"
            - "INVALID_HECREGISTRATIONNUMBER"
        detail:
          type: "string"

    WalkInVetRequest400:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["MISSING_APPLICATIONID", "INVALID_APPLICATIONID"]
        detail:
          type: "string"

    Unauthenticated401:
      description: >-
        The Ed25519 bearer kinds fail with this. identity-service's
        applicant-session routes fail with INVALID_SESSION instead — same
        status, different code, different service.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "UNAUTHENTICATED"
        detail:
          type: "string"

    Forbidden403:
      description: >-
        Authenticated, wrong principal kind. NOT a discriminated union with the
        other 403 shapes in the platform: withAuth emits { error, detail },
        outcome branches emit { error } alone, and biometric-service emits
        { status: AGENCY_MISMATCH }. Three incompatible bodies for one status is
        a live platform inconsistency, recorded rather than smoothed over.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          const: "FORBIDDEN"
        detail:
          type: "string"

    ApplicationError500:
      description: >-
        Detail withheld. HttpError sets expose = status < 500, so every 5xx
        detail string written in the backend is discarded before it reaches the
        wire. Do not build UI that reads detail off a 5xx; there is never one
        there.
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum:
            - "APPLICATION_READ_ERROR"
            - "APPLICATION_PERSISTENCE_ERROR"
            - "INTERNAL_ERROR"
