name: USRP Frontend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22'
  BACKEND_SHA: 47d9ad3ab019f6d2f826cfae2136cbff898d733f
  TURBO_SCM_BASE: origin/main
  TURBO_SCM_HEAD: HEAD

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: node --test --test-reporter=spec tooling/repo-hygiene/test/*.test.mjs
      - run: node tooling/repo-hygiene/verify.mjs

  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Resolve one workspace dependency graph
        run: pnpm install --no-frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm typecheck:affected

  ads-lint:
    name: ADS conformance
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm lint:affected
      - run: pnpm scan:cssmap

  contract-drift:
    name: Contract drift vs pinned backend
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm --filter @usrp/contracts run drift:selftest
      - run: pnpm --filter @usrp/contracts run verify -- --backend "$GITHUB_WORKSPACE/backend"

  test:
    name: Unit + integration tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm test:affected

  a11y:
    name: Accessibility
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm --filter @usrp/design-system exec playwright install --with-deps chromium
      - run: pnpm --filter @usrp/design-system run test
      - run: pnpm --filter @usrp/design-system run build-storybook --quiet
      - run: pnpm a11y

  build:
    name: Build and production proof
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: pnpm verify:extraction
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with: { name: frontend-production-dist, path: apps/*/dist, if-no-files-found: error, retention-days: 7 }

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0', run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: ${{ env.NODE_VERSION }}, cache: pnpm }
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --no-frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with: { name: frontend-production-dist }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: bash tooling/security/security-scan.sh --selftest
      - run: bash tooling/security/security-scan.sh --no-audit
        continue-on-error: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: 1, ignore-unfixed: true }

  gate:
    name: Quality Gate
    if: always()
    needs: [hygiene, typecheck, ads-lint, contract-drift, test, a11y, build, e2e, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert every required job succeeded
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Quality gate RED. Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "Quality gate GREEN."
