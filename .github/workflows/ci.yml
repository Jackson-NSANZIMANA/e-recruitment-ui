name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_SHA: 47d9ad3ab019f6d2f826cfae2136cbff898d733f

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate backend checkout credential
        env:
          BACKEND_REPO_READ_TOKEN: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_REPO_READ_TOKEN:-}" ]; then
            echo "BACKEND_REPO_READ_TOKEN is not configured. Full contract drift verification cannot run." >&2
            echo "Create a read-only fine-grained token for Jackson-NSANZIMANA/e-recruitment and add it as the BACKEND_REPO_READ_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Checkout pinned backend
        uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
          token: ${{ secrets.BACKEND_REPO_READ_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts against pinned backend
        run: pnpm --filter @usrp/contracts run verify -- --backend "$GITHUB_WORKSPACE/backend"

      - name: Type-check (all packages)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/officer-console/playwright-report/
            apps/applicant-portal/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
