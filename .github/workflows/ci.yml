name: USRP Frontend CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BACKEND_SHA: 47d9ad3ab019f6d2f826cfae2136cbff898d733f
  TURBO_SCM_BASE: origin/main
  TURBO_SCM_HEAD: HEAD

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: node --test tooling/repo-hygiene/test/*.test.mjs
      - run: pnpm verify:hygiene

  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:affected

  ads-lint:
    name: ADS conformance
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:affected
      - run: pnpm scan:cssmap

  contract-drift:
    name: Contract drift vs pinned backend
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @usrp/contracts run drift:selftest
      - run: pnpm --filter @usrp/contracts run verify -- --backend "$GITHUB_WORKSPACE/backend"

  test:
    name: Unit + integration tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:affected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 7

  a11y:
    name: Accessibility
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @usrp/design-system run test
      - run: pnpm --filter @usrp/design-system run build-storybook --quiet
      - run: pnpm a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-a11y-failure
          path: |
            packages/design-system/storybook-static
            .storybook-logs
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and production proof
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:extraction
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-production-dist
          path: apps/*/dist
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: {node-version: ${{ env.NODE_VERSION }}, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-failure
          path: |
            apps/*/playwright-report
            apps/*/test-results
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: 1, ignore-unfixed: true}

  gate:
    name: Quality Gate
    if: always()
    needs: [hygiene, typecheck, ads-lint, contract-drift, test, a11y, build, e2e, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert every required job succeeded
        env: {RESULTS: ${{ toJSON(needs) }}}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | grep -o '"result": *"[a-z]*"' | grep -v '"success"' || true)
          test -z "$failed" || { echo "::error::Quality gate RED. Required job failed, skipped, or cancelled."; exit 1; }
          echo "Quality gate GREEN."
