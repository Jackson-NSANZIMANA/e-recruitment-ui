name: USRP Frontend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Feature branches cancel their own in-progress runs; main always runs to
# completion so the protected branch keeps a full signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '24'
  # Every production build in this workflow needs its edge origin (the build
  # refuses without one), and more than one job builds: `test:e2e` depends on
  # `build`, so the E2E job rebuilds. One workflow-level value keeps every
  # job's bundle identical. These are proof/E2E builds whose specs intercept
  # /edge/v1/** in the browser, so they point at the local harness edge; a
  # deployment sets its own VITE_EDGE_URL (.env.example documents it).
  VITE_EDGE_URL: http://localhost:4021
  BACKEND_SHA: df80f6517247a00ffd99518fd31bd7c68dd70d65
  TURBO_SCM_BASE: origin/main
  TURBO_SCM_HEAD: HEAD
  # One Trivy for the whole pipeline. The advisory scan (security-scan.sh, which
  # falls back to a pinned aquasec/trivy image) and the blocking scan below used
  # to resolve DIFFERENT Trivy versions, and on run 94637887182 they disagreed:
  # the advisory one reported a HIGH in @remix-run/router, the blocking one
  # reported the same lockfile clean. Two scanners that can contradict each
  # other give you the answer you like, not the answer that is true.
  TRIVY_VERSION: '0.70.0'
  # Turborepo prints a telemetry notice in every job otherwise.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  agent-foundation:
    name: Frontend agent foundation
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm verify:surface-manifest
      - run: pnpm --filter @usrp/feature-applications run test:model

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: node --test --test-reporter=spec tooling/repo-hygiene/test/*.test.mjs
      # The evidence collector's parsers decide what the bundle calls passed,
      # so their selftest sits inside the Quality Gate, not only in the
      # (ungated) evidence job.
      - name: Evidence collector selftest
        run: node --test --test-reporter=spec tooling/ci/test/*.test.mjs
      - run: node tooling/repo-hygiene/verify.mjs
      - run: node --experimental-strip-types tooling/surface-contract/src/cli.ts
      # ADR-FE-009: each readiness rung's evidence check is watched going red.
      - name: Surface readiness selftest
        run: node --experimental-strip-types tooling/surface-contract/src/cli.ts --selftest

  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Resolves pnpm from `packageManager` in the root package.json.
      # If that field is absent, pin `version:` here explicitly.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Resolve workspace dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Credentials persist: the git fetch below needs them on a private repo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: bash tooling/ci/run-scoped.sh typecheck

  ads-lint:
    name: ADS conformance
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Credentials persist: the git fetch below needs them on a private repo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: bash tooling/ci/run-scoped.sh lint
      - run: pnpm scan:cssmap

  contract-drift:
    name: Contract drift vs pinned backend
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # If e-recruitment is private, add: token: ${{ secrets.CROSS_REPO_PAT }}
      - uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @usrp/contracts run drift:selftest
      - run: pnpm --filter @usrp/contracts run verify -- --backend "$GITHUB_WORKSPACE/backend"

  test:
    name: Unit + integration tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Credentials persist: the git fetch below needs them on a private repo.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: bash tooling/ci/run-scoped.sh test

  a11y:
    name: Accessibility
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @usrp/design-system exec playwright install --with-deps chromium
      - run: pnpm --filter @usrp/design-system run test
      - run: pnpm --filter @usrp/design-system run build-storybook --quiet
      - run: pnpm a11y

  build:
    name: Build and production proof
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: pnpm verify:extraction
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: apps
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Scoped to apps/ so build output lands deterministically instead of
      # unpacking over the workspace root.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production-dist
          path: apps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/officer-console/playwright-report/
            apps/applicant-portal/playwright-report/
            apps/officer-console/test-results/
            apps/applicant-portal/test-results/
            apps/field-station/playwright-report/
            apps/field-station/test-results/
          retention-days: 7
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Security scan selftest (blocking)
        run: bash tooling/security/security-scan.sh --selftest
      - name: Security scan (advisory, does not gate)
        run: bash tooling/security/security-scan.sh --no-audit
        continue-on-error: true
      - name: Trivy filesystem scan (blocking, fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Pinned so this and security-scan.sh cannot resolve different
          # databases and reach different verdicts on the same lockfile.
          version: v${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  gate:
    name: Quality Gate
    if: always()
    needs: [hygiene, typecheck, ads-lint, contract-drift, test, a11y, build, e2e, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert every required job succeeded
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .

          # Every job in `needs` is unconditional, so "skipped" here always means
          # an upstream job failed and this one never ran. Both are red, but they
          # are reported separately: naming the failure and the collateral apart
          # points a reader at the cause instead of at a list of job names.
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
            | "  - " + .key + ": " + .value.result')
          skipped=$(echo "$RESULTS" | jq -r '
            to_entries[] | select(.value.result == "skipped") | "  - " + .key')

          if [ -n "$failed" ] || [ -n "$skipped" ]; then
            echo "::error::Quality gate RED."
            if [ -n "$failed" ]; then
              echo "Failed:"
              echo "$failed"
            fi
            if [ -n "$skipped" ]; then
              echo "Never ran (an upstream job failed):"
              echo "$skipped"
            fi
            exit 1
          fi
          echo "Quality gate GREEN."

  evidence:
    name: Evidence bundle
    # Runs after every job, whatever their result, so a red run still leaves a
    # record of what was measured. W0-04: docs cite this artefact instead of
    # hand-written counts and SHAs. Not part of the Quality Gate.
    needs: [hygiene, typecheck, ads-lint, contract-drift, test, a11y, build, e2e, security-scan, gate]
    # !cancelled(), not always(): a superseded run leaves no partial bundle.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      # Unit suites import workspace packages from dist/ (turbo `test` dependsOn ^build).
      - run: pnpm turbo run build
      - name: Fetch the Playwright reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e-report
      # Runs every package's unit suite over the WHOLE workspace (the test job is
      # affected-only on PRs) and the static proofs, then writes the bundle.
      # Exits non-zero on a failure, after writing it.
      - name: Write evidence bundle
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node tooling/ci/evidence-bundle.mjs --out evidence
          --backend "$GITHUB_WORKSPACE/backend" --run-proofs --run-tests
          --e2e-dir e2e-report --needs "$NEEDS"
      # Named by the commit CI actually tested: on a pull_request run that is
      # the merge commit, so the push run and the PR run of one head never
      # publish two different bundles under the same name. On main they agree.
      - name: Upload evidence bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: evidence/evidence-${{ env.EVIDENCE_HEAD_SHA }}.json
          if-no-files-found: error

  # ── S03 (ADR-FE-014): SPA serving images and the release bundle ──────────

  spa-images:
    name: SPA image (${{ matrix.app }})
    # PRs build, test and scan without publishing; main publishes. Branch
    # pushes are covered by their PR run.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # packages/id-token are used only by the steps gated on PUBLISH (main). A
    # fork's pull_request token is read-only whatever this says, and a
    # same-repo author can already edit this file, so the grant widens nothing.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # `origin` is the public origin the bundle calls (VITE_EDGE_URL is
        # compiled in). Placeholders until S07 fixes hosting; adding the field
        # station is one entry with `permissions: camera=(self), ...` and
        # `camera: true`.
        include:
          - app: applicant-portal
            origin: https://portal.usrp.gov.rw
            permissions: ''
            camera: false
          - app: officer-console
            origin: https://officer.usrp.gov.rw
            permissions: ''
            camera: false
          # S02 (ADR-FE-007): the exam-day tablet scans QR codes, so it alone
          # may use the camera, and only from its own origin.
          - app: field-station
            origin: https://field.usrp.gov.rw
            permissions: 'camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=()'
            camera: true
    env:
      APP: ${{ matrix.app }}
      IMAGE: ghcr.io/jackson-nsanzimana/usrp-${{ matrix.app }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIZE_BUDGET_BYTES: '80000000'
      COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build facts
        id: facts
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          mkdir -p out
      # Loaded, not pushed: the bytes tested and scanned are the bytes pushed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/images/spa/Dockerfile
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            VITE_EDGE_URL=${{ matrix.origin }}
            ${{ matrix.permissions && format('PERMISSIONS_POLICY={0}', matrix.permissions) || '' }}
            USRP_BUILD_SHA=${{ github.sha }}
            USRP_BUILD_REF=${{ github.ref }}
            USRP_BUILD_TIME=${{ steps.facts.outputs.time }}
          cache-from: type=gha,scope=spa-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=spa-${{ matrix.app }}
      - name: Size budget
        id: size
        run: |
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE:$GITHUB_SHA")
          echo "bytes=$size" >> "$GITHUB_OUTPUT"
          echo "$APP: $size bytes (budget $SIZE_BUDGET_BYTES)"
          if [ "$size" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::$APP is $size bytes, over its $SIZE_BUDGET_BYTES budget (ADR-FE-014)."
            exit 1
          fi
      # Boots the image hardened (read-only, cap-drop ALL) in both edge modes:
      # headers, cache policy, SPA fallback, /edge never the shell, build stamp.
      - name: Serving contract (headers, fallback, /edge, stamp)
        env:
          CAMERA: ${{ matrix.camera }}
        run: |
          if [ "$CAMERA" = "true" ]; then
            node tooling/images/verify-spa-image.mjs --image "$IMAGE:$GITHUB_SHA" --sha "$GITHUB_SHA" --camera
          else
            node tooling/images/verify-spa-image.mjs --image "$IMAGE:$GITHUB_SHA" --sha "$GITHUB_SHA"
          fi
      - name: Scan (Trivy, CRITICAL/HIGH blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: infrastructure/images/trivy-exceptions.yaml
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          version: v${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: out/trivy.json
          exit-code: '1'
      - name: Show findings
        if: ${{ failure() }}
        run: |
          [ -f out/trivy.json ] || { echo "no Trivy report: the scanner did not run (could not verify)"; exit 0; }
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)\t\($t)"' out/trivy.json
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          version: v${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: out/sbom.cdx.json
          exit-code: '0'
      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        id: push
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "pushed $ref"
      - uses: sigstore/cosign-installer@v4.1.2
        if: ${{ env.PUBLISH == 'true' }}
        with:
          cosign-release: v3.1.3
      - name: Sign, attest the SBOM, verify both
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate out/sbom.cdx.json "$ref"
          cosign verify --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$ref" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$ref" > /dev/null
          echo "signed and verified: $ref"
      - name: Image metadata
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SIZE: ${{ steps.size.outputs.bytes }}
        run: |
          signed=false; [ -n "$DIGEST" ] && signed=true
          jq -n --arg name "$APP" --arg image "$IMAGE" --arg digest "$DIGEST" --arg sha "$GITHUB_SHA" \
                --argjson size "$SIZE" --argjson budget "$SIZE_BUDGET_BYTES" --argjson signed "$signed" \
                --arg identity "$COSIGN_IDENTITY" --arg issuer "$COSIGN_ISSUER" \
            '{name: $name, image: $image, digest: (if $digest == "" then null else $digest end), tags: [$sha],
              sizeBytes: $size, sizeBudgetBytes: $budget, sbom: "sbom.cdx.json", scan: "trivy.json",
              signed: $signed, attested: $signed,
              signerIdentity: (if $signed then $identity else null end), signerIssuer: (if $signed then $issuer else null end)}' \
            > out/metadata.json
          cat out/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: out/
          if-no-files-found: error

  release-bundle:
    name: Release bundle (dry run on PRs, candidate on main)
    needs: [spa-images, evidence]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MODE: ${{ github.event_name == 'push' && 'candidate' || 'dry-run' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence-${{ github.sha }}
          path: evidence
      - name: Compose
        run: >-
          node tooling/ci/release-bundle.mjs --mode "$MODE" --tag "$MODE-$EVIDENCE_HEAD_SHA"
          --sha "$EVIDENCE_HEAD_SHA" --peer-sha "$BACKEND_SHA" --images images
          --evidence "evidence/evidence-$EVIDENCE_HEAD_SHA.json"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MODE }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
