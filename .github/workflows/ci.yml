name: USRP Frontend CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BACKEND_SHA: 47d9ad3ab019f6d2f826cfae2136cbff898d733f
  TURBO_SCM_BASE: origin/main
  TURBO_SCM_HEAD: HEAD

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Hygiene: zero-dependency gates that need no node_modules.
  # Runs FIRST so a bad blob or boundary violation fails in ~10s.
  # ────────────────────────────────────────────────────────────────────────────
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: node --test tooling/repo-hygiene/test/*.test.mjs
      - run: pnpm verify:hygiene

  # ────────────────────────────────────────────────────────────────────────────
  # Install: prime the pnpm store AND cache node_modules for downstream jobs.
  # Every downstream job restores this cache instead of re-running install.
  # ────────────────────────────────────────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ────────────────────────────────────────────────────────────────────────────
  # Typecheck: ultra-strict zero-error tsc.
  # ────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck:affected

  # ────────────────────────────────────────────────────────────────────────────
  # ADS conformance: the frontend's correctness contract.
  # ────────────────────────────────────────────────────────────────────────────
  ads-lint:
    name: ADS conformance
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint:affected
      - run: pnpm scan:cssmap

  # ────────────────────────────────────────────────────────────────────────────
  # Contract drift: runs the drift tool's own selftest BEFORE trusting it.
  # ────────────────────────────────────────────────────────────────────────────
  contract-drift:
    name: Contract drift vs pinned backend
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Jackson-NSANZIMANA/e-recruitment
          ref: ${{ env.BACKEND_SHA }}
          path: backend
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @usrp/contracts run drift:selftest
      - run: pnpm --filter @usrp/contracts run verify -- --backend "$GITHUB_WORKSPACE/backend"

  # ────────────────────────────────────────────────────────────────────────────
  # Unit + integration tests.
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit + integration tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: git fetch origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:affected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Accessibility: axe-core over every Storybook story in a real browser.
  # ────────────────────────────────────────────────────────────────────────────
  a11y:
    name: Accessibility
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @usrp/design-system run test
      - run: pnpm --filter @usrp/design-system run build-storybook --quiet
      - run: pnpm a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: storybook-a11y-failure
          path: |
            packages/design-system/storybook-static
            .storybook-logs
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Build: production bundles + extraction proof + bundle budget.
  # Artifacts are consumed by the e2e job.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build and production proof
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build
      - run: pnpm verify:extraction
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: apps/*/dist
          if-no-files-found: error
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Playwright E2E: runs against the PRODUCTION BUILD, not source.
  # ────────────────────────────────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/features/*/node_modules
            tooling/*/node_modules
          key: nm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production-dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-failure
          path: |
            apps/*/playwright-report
            apps/*/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Security: the REPO'S OWN SCRIPT first, then Trivy.
  #
  # Both, not one. The script's five repo-tracking checks need no node_modules
  # and no registry, so they report in seconds and cannot be disabled by a
  # broken dependency graph - which is not hypothetical, see the workspace-glob
  # incident of 2026-09-08. Trivy stays as a pinned action because the runner
  # has no trivy binary and the action's caching beats pulling the image.
  #
  # The script detects the absent binary and SKIPS its own Trivy step loudly, so
  # the two never double-scan and the skip is visible rather than silent.
  #
  # --no-audit is deliberate: `pnpm audit` needs a resolved graph, and this job
  # does no install, so running it here would report an unearned pass. It runs
  # locally via `pnpm security:scan`, where a developer has actually installed.
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Prove the scan goes red on a planted violation
        run: bash tooling/security/security-scan.sh --selftest
      - name: Repo-owned security scan
        run: bash tooling/security/security-scan.sh --no-audit
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  # ────────────────────────────────────────────────────────────────────────────
  # Quality Gate: the ONE required status check.
  #
  # THIS GATE WAS RED AND CORRECT FOR ELEVEN HOURS ON 2026-09-08 WHILE WORK
  # CONTINUED ON TOP OF IT. Every mechanism functioned. The missing part was not
  # a gate: it was that a red required check did not stop anything. Make this a
  # branch-protected required check on main.
  # ────────────────────────────────────────────────────────────────────────────
  gate:
    name: Quality Gate
    if: always()
    needs: [hygiene, typecheck, ads-lint, contract-drift, test, a11y, build, e2e, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::Quality gate RED. Required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "Quality gate GREEN."
